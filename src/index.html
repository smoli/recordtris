<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Tetris</title>
<meta name="morphos:icon" content="🧱">
<meta name="morphos:lib" content="preact">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="screens.css">

<body>
<div id="app"></div>
<!-- Die Ton-Diagnose (Taste T) hängt an einer eigenen Wurzel und liegt damit über
     jeder Ansicht. --><div id="diag"></div>

<!-- Die vier Klänge des Spiels. Ihre Quelle ist die jeweilige Beigabe aus dem
     Ordner assets: Das Bündeln setzt am src eines <source> die Aufnahme selbst
     ein — das ist erwiesen, im gebauten Dokument steht dort eine data:-Quelle.
     Deshalb steht der Pfad nur noch HIER und nicht mehr an zwei weiteren Stellen:
     jede Aufnahme einmal im Dokument statt dreimal.
     Gelesen wird sie von soundassets.js, abgespielt über sound.js. -->
<audio id="snd-move" preload="auto"><source src="assets/move-and-turn-shorter.wav" type="audio/wav"></audio>
<audio id="snd-drop" preload="auto"><source src="assets/drop-sound.mp3" type="audio/mpeg"></audio>
<audio id="snd-rows" preload="auto"><source src="assets/row-completed-sound.mp3" type="audio/mpeg"></audio>
<audio id="snd-tetris" preload="auto"><source src="assets/tetris-sound.mp3" type="audio/mpeg"></audio>

<script src="rng.js"></script>
<script src="seed.js"></script>
<script src="pieces.js"></script>

<script src="highscores.js"></script>
<script src="archive.js"></script>
<script src="analysis.js"></script>
<script src="fxpaint.js"></script>
<script src="sound.js"></script>
<script src="arp.js"></script>
<script src="pad.js"></script>
<script src="soundassets.js"></script>
<script src="soundfiles.js"></script>
<script src="fx.js"></script>
<script src="gameui.js"></script>
<script src="statsui.js"></script>
<script src="scoresui.js"></script>
<script src="replay.js"></script>
<script src="replayui.js"></script>
<script src="app.js"></script>
<script src="sounddiag.js"></script>
</body>
</html>
