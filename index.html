   Zustand des Zufalls, damit von jeder Stelle aus weitergespielt werden kann.
   Die Zeitachse ist die gespielte Zeit (state.elapsed), nicht die Zahl der Bilder. */
const TetrisReplay = (function () {
  const SPEEDS = [0.25, 0.5, 1, 2, 4];
  const SPEED_LABELS = ["¼×", "½×", "1×", "2×", "4×"];

  // Zeigt das Bild dasselbe wie das vorherige, muss es nicht aufs Band.
  function sameFrame(a, b) {
    if (a.board !== b.board || a.score !== b.score || a.lines !== b.lines) return false;
    if (a.nextType !== b.nextType || a.over !== b.over) return false;
    if ((a.clearRows === null) !== (b.clearRows === null)) return false;
    if ((a.piece === null) !== (b.piece === null)) return false;
    if (!a.piece) return true;
    return a.piece.type === b.piece.type && a.piece.rot === b.piece.rot &&
           a.piece.x === b.piece.x && a.piece.y === b.piece.y;
  }

  function record(frames, state) {
    const snap = TetrisEngine.snapshot(state);
    const last = frames.length ? frames[frames.length - 1] : null;
    if (last) {
      // Unverändertes Feld: dieselbe Zeichenkette weiterverwenden statt sie zu kopieren.
      if (last.board === snap.board) snap.board = last.board;
      if (sameFrame(last, snap)) return false;
    }
    frames.push(snap);
    return true;
  }

  function cursor(frames, index) {
    const i = Math.max(0, Math.min(frames.length - 1, index));
    return { index: i, playing: false, dir: 1, speed: 1, time: frames[i].t };
  }

  function seek(cur, frames, index) {
    const i = Math.max(0, Math.min(frames.length - 1, index));
    cur.time = frames[i].t;
    if (i === cur.index) return false;
    cur.index = i;
    return true;
  }

  // Ein Bild weiter oder zurück — das hält das Abspielen an.
  function step(cur, frames, delta) {
    cur.playing = false;
    return seek(cur, frames, cur.index + delta) || true;
  }

  /* Abspielen in eine Richtung. Steht der Kopf schon am Ende dieser Richtung,
     beginnt er am anderen Ende von vorn. */
  function play(cur, frames, dir) {
    cur.dir = dir;
    cur.playing = true;
    if (dir > 0 && cur.index >= frames.length - 1) seek(cur, frames, 0);
    else if (dir < 0 && cur.index <= 0) seek(cur, frames, frames.length - 1);
    else cur.time = frames[cur.index].t;
    return true;
  }

  function pause(cur, frames) {
    cur.playing = false;
    cur.time = frames[cur.index].t;
    return true;
  }

  // Ein Bildtakt des Abspielens; liefert, ob sich sichtbar etwas geändert hat.
  function advance(cur, frames, dt) {
    if (!cur.playing) return false;
    const before = cur.index;
    cur.time += dt * cur.speed * cur.dir;
    let i = cur.index;
    if (cur.dir > 0) {
      while (i + 1 < frames.length && frames[i + 1].t <= cur.time) i++;
      if (i >= frames.length - 1) { i = frames.length - 1; cur.playing = false; cur.time = frames[i].t; }
    } else {
      while (i > 0 && frames[i - 1].t >= cur.time) i--;
      if (i <= 0) { i = 0; cur.playing = false; cur.time = frames[0].t; }
    }
    cur.index = i;
    return i !== before || !cur.playing;
  }

  // "1:23,4" — Minuten, Sekunden, Zehntel der gespielten Zeit.
  function formatTime(ms) {
    const tenths = Math.max(0, Math.round(ms / 100));
    const secs = Math.floor(tenths / 10);
    const mm = Math.floor(secs / 60);
    const ss = secs % 60;
    return mm + ":" + (ss < 10 ? "0" + ss : ss) + "," + (tenths % 10);
  }

  return {
    SPEEDS: SPEEDS,
    SPEED_LABELS: SPEED_LABELS,
    record: record,
    cursor: cursor,
    seek: seek,
    step: step,
    play: play,
    pause: pause,
    advance: advance,
    formatTime: formatTime
  };
})();
</script>
<script>/* Die Bedienleiste der Wiedergabe: Schieberegler, Transport, Tempo und der
   Wiedereinstieg. Sie kennt nur den Abspielkopf und meldet Wünsche nach oben. */
function ReplayBar({ frames, cur, canResume, onSeek, onStep, onPlay, onPause, onSpeed, onResume, onClose }) {
  const last = frames.length - 1;
  const frame = frames[cur.index];
  const forward = cur.playing && cur.dir > 0;
  const backward = cur.playing && cur.dir < 0;

  return html`<div class="replay-bar">
    <input class="scrub" type="range" min="0" max=${last} step="1" value=${cur.index}
      onInput=${(e) => onSeek(Number(e.target.value))} />
    <div class="replay-meta">
      <span>${TetrisReplay.formatTime(frame.t)} / ${TetrisReplay.formatTime(frames[last].t)}</span>
      <span>Bild ${cur.index + 1} von ${frames.length}</span>
    </div>

    <div class="replay-row">
      <button class="rb" title="An den Anfang" onClick=${() => onSeek(0)}>⏮</button>
      <button class="rb" title="Ein Bild zurück" onClick=${() => onStep(-1)}>◀|</button>
      <button class=${"rb" + (backward ? " on" : "")} title="Rückwärts abspielen"
        onClick=${() => (backward ? onPause() : onPlay(-1))}>◀◀</button>
      <button class=${"rb" + (forward ? " on" : "")} title="Vorwärts abspielen"
        onClick=${() => (forward ? onPause() : onPlay(1))}>${forward ? "⏸" : "▶"}</button>
      <button class="rb" title="Ein Bild vor" onClick=${() => onStep(1)}>|▶</button>
      <button class="rb" title="Ans Ende" onClick=${() => onSeek(last)}>⏭</button>
    </div>

    <div class="replay-row">
      <span class="replay-label">Tempo</span>
      ${TetrisReplay.SPEEDS.map((s, i) => html`
        <button key=${s} class=${"rb" + (cur.speed === s ? " on" : "")}
          onClick=${() => onSpeed(s)}>${TetrisReplay.SPEED_LABELS[i]}</button>`)}
    </div>

    <div class="replay-row wide">
      <button class="start small" disabled=${!canResume} onClick=${onResume}>Hier weiterspielen</button>
      <button class="rb wideb" onClick=${onClose}>Zurück</button>
    </div>
    ${!canResume && html`<p class="hint tight">Zum Weiterspielen ein Stück zurückspulen.</p>`}
  </div>`;
}

// Die Tastenhilfe der Wiedergabe — sie ersetzt in der Seitenspalte die des Spiels.
function ReplayKeys() {
  return html`<div class="box keys">
    <h2>Wiedergabe</h2>
    <p><kbd>←</kbd><kbd>→</kbd> ein Bild</p>
    <p><kbd>Leer</kbd> abspielen · <kbd>B</kbd> rückwärts</p>
    <p><kbd>1</kbd>…<kbd>5</kbd> Tempo</p>
    <p><kbd>Enter</kbd> hier weiterspielen</p>
    <p><kbd>S</kbd> Ton an/aus</p>
    <p><kbd>Esc</kbd> zurück</p>
  </div>`;
}
</script>
<script>/* Zustand und Steuerung. Der Spielzustand liegt in einer Ref und wird vom Bildtakt
   fortgeschrieben; neu gezeichnet wird nur, wenn sich etwas geändert hat. Derselbe
   Takt schreibt jedes veränderte Bild aufs Band — und spielt es auf Wunsch wieder ab. */
const { render } = preact;
const { useState, useRef, useEffect, useCallback } = preactHooks;

const DAS_START = 170; // Wartezeit bis zur Wiederholung beim Halten
const DAS_RATE = 50;   // Abstand der Wiederholungen
const DROP_RATE = 45;  // Wiederholung beim Halten von Pfeil runter

/* Zwei Fristen für eine gehaltene Taste, von der kein Lebenszeichen mehr kommt:
   Das System wiederholt jede gehaltene Taste laufend als keydown. Bleibt diese
   Wiederholung aus, obwohl sie schon einmal kam, ist die Taste in Wahrheit
   losgelassen und das keyup unterwegs verloren gegangen — dann muss die
   Wiederholung von selbst enden, sonst liefe der Stein von allein weiter. Kam
   noch nie eine Wiederholung, gilt die längere Frist als grobe Notbremse. */
const HELD_STALE_MS = 900;
const HELD_MAX_MS = 2500;

/* Welche Taste welche Richtung meint. Gelesen wird zuerst die physische Taste
   (e.code), damit Loslassen auch dann passt, wenn e.key sich zwischendurch
   ändert — etwa weil eine Zusatztaste dazukam. */
const DIR_KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowDown: "down" };
function dirOf(e) { return DIR_KEYS[e.code] || DIR_KEYS[e.key] || null; }

function App() {
  const gameRef = useRef(null);
  const heldRef = useRef({});
  const tapeRef = useRef([]);   // die Aufzeichnung der laufenden Partie
  const replayRef = useRef(null); // der Abspielkopf, solange die Wiedergabe läuft
  const storeRef = useRef(TetrisScores.empty()); // die Bestenliste
  const lastRef = useRef(null);   // der Eintrag der eben beendeten Partie
  const savedRef = useRef(false); // ist die laufende Partie schon eingetragen?
  const [startLevel, setStartLevel] = useState(0);
  const [mode, setMode] = useState(TetrisEngine.CLASSIC); // Klassisch oder Endlos
  const [musical, setMusical] = useState(false); // das Klangbett des Endlosspiels
  const [seedWord, setSeedWord] = useState(() => TetrisSeed.randomWord());
  const [showScores, setShowScores] = useState(false);
  const [muted, setMuted] = useState(false); // der Ton, an einer Stelle geschaltet
  const [, bump] = useState(0);

  // Die Bestenliste kommt aus der Datei — einmal beim Öffnen der App.
  useEffect(() => {
    let alive = true;
    TetrisScores.load().then((s) => {
      if (!alive) return;
      // Wurde beim Lesen schon gespielt, bleiben diese Partien erhalten.
      const pending = storeRef.current.entries;
      if (pending.length) {
        storeRef.current = { version: s.version, entries: s.entries.concat(pending), storage: s.storage };
        TetrisScores.save(storeRef.current).then((saved) => {
          if (!alive) return;
          storeRef.current = saved;
          bump((v) => v + 1);
        });
      } else {
        storeRef.current = s;
      }
      bump((v) => v + 1);
    });
    return () => { alive = false; };
  }, []);

  /* Eine beendete Partie kommt in die Liste: Zeitpunkt, Punkte, Reihen, die
     Reihenschläge und die Steinstatistik — und dann in die Datei. */
  const saveResult = useCallback((g) => {
    const entry = TetrisScores.entryFrom(g);
    lastRef.current = entry;
    storeRef.current = TetrisScores.add(storeRef.current, entry);
    bump((v) => v + 1);
    TetrisScores.save(storeRef.current).then((s) => {
      storeRef.current = s;
      bump((v) => v + 1);
    });
  }, []);

  const startGame = useCallback((lvl, word, m, mus) => {
    heldRef.current = {};
    tapeRef.current = [];
    replayRef.current = null;
    savedRef.current = false;
    lastRef.current = null;
    TetrisPad.stop(); // was von der vorigen Partie noch steht, verstummt
    gameRef.current = TetrisEngine.create(lvl, word, m, mus);
    setSeedWord(gameRef.current.seedWord); // ein gewürfeltes Wort bleibt sichtbar
    bump((v) => v + 1);
  }, []);

  const quit = useCallback(() => {
    TetrisPad.stop();
    gameRef.current = null;
    heldRef.current = {};
    tapeRef.current = [];
    replayRef.current = null;
    savedRef.current = false;
    lastRef.current = null;
    bump((v) => v + 1);
  }, []);

  // Der Ton lässt sich überall abschalten — die Anzeige folgt dem Modul.
  const toggleSound = useCallback(() => {
    setMuted((m) => { TetrisSound.setMuted(!m); return !m; });
  }, []);

  /* Das Klangbett lässt sich jederzeit schalten: auf dem Startbildschirm für die
     nächste Partie, im laufenden Endlosspiel sofort. Einer klassischen Partie
     gehört es nicht — dort tut die Taste nichts. */
  const toggleMusical = useCallback(() => {
    const g = gameRef.current;
    if (g) {
      if (g.mode !== TetrisEngine.FOREVER || g.over) return;
      g.musical = !g.musical;
      if (g.musical) TetrisEngine.chordCue(g); else TetrisPad.stop();
      g.version++;
      setMusical(g.musical);
    } else {
      setMusical((m) => !m);
    }
    bump((v) => v + 1);
  }, []);

  const openScores = useCallback(() => setShowScores(true), []);
  const closeScores = useCallback(() => setShowScores(false), []);

  /* Aus der Bestenliste heraus dieselbe Steinfolge noch einmal: Das Wort wird
     übernommen, die Liste schließt, und ein neues Spiel beginnt damit — eine
     laufende Partie ist danach verworfen. Das Startlevel bleibt das gewählte. */
  const playSeed = useCallback((word) => {
    const clean = TetrisSeed.sanitizeInput(word);
    if (!clean) return;
    setSeedWord(clean);
    setMode(TetrisEngine.CLASSIC);
    setShowScores(false);
    startGame(startLevel, clean, TetrisEngine.CLASSIC, false);
  }, [startLevel, startGame]);

  /* Aus der Endlos-Liste heraus dasselbe Level noch einmal: Das Level wird
     übernommen, das Merkwort bleibt das gewählte. */
  const playLevel = useCallback((lvl) => {
    setStartLevel(lvl);
    setMode(TetrisEngine.FOREVER);
    setShowScores(false);
    startGame(lvl, seedWord, TetrisEngine.FOREVER, musical);
  }, [seedWord, musical, startGame]);

  // Bildtakt: Schwerkraft, Tastenwiederholung, Aufzeichnung — oder die Wiedergabe.
  useEffect(() => {
    let raf = 0;
    let last = null;
    let seen = -1;
    let clockSec = -1; // die zuletzt gezeigte Sekunde der Endlos-Uhr
    const step = (t) => {
      const dt = last === null ? 0 : Math.min(t - last, 200);
      last = t;
      const g = gameRef.current;
      const rp = replayRef.current;
      if (rp) {
        if (TetrisReplay.advance(rp, tapeRef.current, dt)) bump((v) => v + 1);
      } else if (g) {
        repeatKeys(g, dt);
        TetrisEngine.update(g, dt);
        if (g.over && !savedRef.current) { savedRef.current = true; saveResult(g); }
        if (g.version !== seen) {
          seen = g.version;
          clockSec = Math.round(g.elapsed / 1000);
          if (!g.paused) TetrisReplay.record(tapeRef.current, g);
          bump((v) => v + 1);
        } else if (g.mode === TetrisEngine.FOREVER && !g.paused && !g.over) {
          // Die Uhr des Endlosspiels läuft weiter, auch wenn sich sonst nichts regt.
          const sec = Math.round(g.elapsed / 1000); // wie formatDuration rundet
          if (sec !== clockSec) { clockSec = sec; bump((v) => v + 1); }
        }
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [saveResult]);

  function repeatKeys(g, dt) {
    const held = heldRef.current;
    // Erst prüfen, ob eine der Tasten nur noch scheinbar gehalten wird.
    if (stale(held.left, dt)) held.left = null;
    if (stale(held.right, dt)) held.right = null;
    if (stale(held.down, dt)) held.down = null;
    tick(held.left, dt, DAS_START, DAS_RATE, () => TetrisEngine.move(g, -1));
    tick(held.right, dt, DAS_START, DAS_RATE, () => TetrisEngine.move(g, 1));
    tick(held.down, dt, DROP_RATE, DROP_RATE, () => TetrisEngine.softDrop(g));
  }

  /* Ein Eintrag altert, solange kein keydown ihn bestätigt. Überschreitet er seine
     Frist, gilt die Taste als losgelassen — der Stein bleibt sonst nach einem
     verlorenen keyup an der Wand kleben und lässt sich nicht mehr zurückholen. */
  function stale(entry, dt) {
    if (!entry) return false;
    entry.idle += dt;
    return entry.idle > (entry.watched ? HELD_STALE_MS : HELD_MAX_MS);
  }

  function tick(entry, dt, first, rate, action) {
    if (!entry) return;
    entry.timer += dt;
    let guard = 0;
    while (entry.timer >= (entry.fired ? rate : first) && guard++ < 20) {
      entry.timer -= entry.fired ? rate : first;
      entry.fired = true;
      action();
    }
  }

  // --- Wiedergabe ---

  const openReplay = useCallback(() => {
    const frames = tapeRef.current;
    if (!frames.length) return;
    TetrisPad.stop(); // das Klangbett gehört der laufenden Partie, nicht dem Band
    heldRef.current = {};
    replayRef.current = TetrisReplay.cursor(frames, frames.length - 1);
    bump((v) => v + 1);
  }, []);

  const closeReplay = useCallback(() => {
    replayRef.current = null;
    bump((v) => v + 1);
  }, []);

  const seekTo = useCallback((i) => {
    const rp = replayRef.current;
    if (!rp) return;
    rp.playing = false;
    TetrisReplay.seek(rp, tapeRef.current, i);
    bump((v) => v + 1);
  }, []);

  const stepBy = useCallback((d) => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.step(rp, tapeRef.current, d);
    bump((v) => v + 1);
  }, []);

  const playFrom = useCallback((dir) => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.play(rp, tapeRef.current, dir);
    bump((v) => v + 1);
  }, []);

  const pausePlayback = useCallback(() => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.pause(rp, tapeRef.current);
    bump((v) => v + 1);
  }, []);

  const setSpeed = useCallback((s) => {
    const rp = replayRef.current;
    if (!rp) return;
    rp.speed = s;
    bump((v) => v + 1);
  }, []);

  /* Wiedereinstieg: Aus dem gezeigten Bild wird wieder ein laufendes Spiel. Das Band
     endet an dieser Stelle und zeichnet von hier an den neuen Verlauf auf. */
  const resumeHere = useCallback(() => {
    const rp = replayRef.current;
    if (!rp) return;
    const frames = tapeRef.current;
    const frame = frames[rp.index];
    if (!frame || frame.over) return;
    tapeRef.current = frames.slice(0, rp.index + 1);
    gameRef.current = TetrisEngine.fromSnapshot(frame);
    // Die Partie ist wieder offen — und trägt fortan den Vermerk des Wiedereinstiegs.
    gameRef.current.resumed = true;
    savedRef.current = false;
    replayRef.current = null;
    heldRef.current = {};
    // Die Partie läuft wieder — also steht auch wieder der Akkord ihres Steins.
    TetrisEngine.chordCue(gameRef.current);
    bump((v) => v + 1);
  }, []);

  useEffect(() => {
    function press(key) {
      heldRef.current[key] = { timer: 0, fired: false, idle: 0, watched: false };
    }

    /* Das Lebenszeichen der gehaltenen Tasten. Die Wiederholung des Systems gilt
       immer nur der zuletzt gedrückten Taste: Wer beim Schieben dreht, dessen
       Pfeiltaste hört auf zu wiederholen, obwohl sie gehalten bleibt. Darum zählt
       jeder Tastendruck als Lebenszeichen für alle — nur die Taste, die gerade
       selbst wiederholt, wird überwacht und darf die kurze Frist bekommen.
       Ausgelöst wird hier nichts; das besorgt der Bildtakt. */
    function keepAlive(e, dir) {
      const held = heldRef.current;
      for (const name in held) {
        const entry = held[name];
        if (!entry) continue;
        entry.idle = 0;
        if (name !== dir) entry.watched = false;
        else if (e.repeat) entry.watched = true;
      }
    }

    function onDown(e) {
      const k = e.key;
      // Im Eingabefeld gehören die Tasten dem Anwender, nicht dem Spiel.
      const inField = e.target && e.target.tagName === "INPUT";
      if (!inField && (k === " " || k.indexOf("Arrow") === 0)) e.preventDefault();

      /* Der Ton gehört keiner Ansicht — er lässt sich immer und überall schalten.
         Auch dieser Druck ist ein Lebenszeichen für die gehaltenen Tasten: Wer
         beim Schieben den Ton abschaltet, soll weiterschieben. */
      if (!inField && (k === "s" || k === "S")) {
        keepAlive(e, null);
        if (!e.repeat) toggleSound();
        return;
      }

      // Die Bestenliste liegt über allem: sie kennt nur das Schließen.
      if (showScores) {
        if (k === "Escape" || k === "h" || k === "H") closeScores();
        return;
      }

      // In der Wiedergabe gehören die Tasten dem Abspielkopf.
      const rp = replayRef.current;
      if (rp) {
        if (k === "Escape") { closeReplay(); return; }
        if (k === "Enter") { resumeHere(); return; }
        if (inField) return; // der Schieberegler bedient sich sonst selbst
        if (k === "ArrowRight") stepBy(1);
        else if (k === "ArrowLeft") stepBy(-1);
        else if (e.repeat) return;
        else if (k === " ") { if (rp.playing && rp.dir > 0) pausePlayback(); else playFrom(1); }
        else if (k === "b" || k === "B") { if (rp.playing && rp.dir < 0) pausePlayback(); else playFrom(-1); }
        else if (k === "Home") seekTo(0);
        else if (k === "End") seekTo(tapeRef.current.length - 1);
        else if (k.length === 1 && k >= "1" && k <= "5") setSpeed(TetrisReplay.SPEEDS[Number(k) - 1]);
        return;
      }

      const dir = dirOf(e);
      keepAlive(e, dir);

      if (e.repeat) return;
      const g = gameRef.current;

      if (!g) {
        if (k === "Enter" || (k === " " && !inField)) startGame(startLevel, seedWord, mode, musical);
        else if (!inField && (k === "h" || k === "H")) openScores();
        else if (!inField && (k === "m" || k === "M")) {
          setMode(mode === TetrisEngine.FOREVER ? TetrisEngine.CLASSIC : TetrisEngine.FOREVER);
        } else if (!inField && (k === "k" || k === "K")) {
          if (mode === TetrisEngine.FOREVER) toggleMusical();
        }
        return;
      }
      if (g.over) {
        if (k === "Enter") startGame(g.startLevel, g.seedWord, g.mode, g.musical);
        else if (k === "r" || k === "R") openReplay();
        else if (k === "h" || k === "H") openScores();
        else if (k === "Escape") quit();
        return;
      }
      // Die Pause gibt auch alle Tasten frei — zweimal P holt eine verhakte zurück.
      if (k === "p" || k === "P") { heldRef.current = {}; TetrisEngine.togglePause(g); return; }
      if (k === "Escape") { quit(); return; }
      if (k === "k" || k === "K") { toggleMusical(); return; }
      if (g.paused) {
        if (k === "r" || k === "R") openReplay();
        else if (k === "h" || k === "H") openScores();
        return;
      }

      if (dir === "left") { TetrisEngine.move(g, -1); press("left"); }
      else if (dir === "right") { TetrisEngine.move(g, 1); press("right"); }
      else if (dir === "down") { TetrisEngine.softDrop(g); press("down"); }
      else if (k === "a" || k === "A") TetrisEngine.rotate(g, -1);
      else if (k === "d" || k === "D") TetrisEngine.rotate(g, 1);
      else if (k === " ") TetrisEngine.hardDrop(g);
    }

    function onUp(e) {
      const dir = dirOf(e);
      if (dir) heldRef.current[dir] = null;
    }

    function onBlur() { heldRef.current = {}; }
    // Ein verdecktes Fenster liefert kein keyup mehr — also alles freigeben.
    function onHidden() { if (document.hidden) heldRef.current = {}; }

    window.addEventListener("keydown", onDown);
    window.addEventListener("keyup", onUp);
    window.addEventListener("blur", onBlur);
    document.addEventListener("visibilitychange", onHidden);
    return () => {
      window.removeEventListener("keydown", onDown);
      window.removeEventListener("keyup", onUp);
      window.removeEventListener("blur", onBlur);
      document.removeEventListener("visibilitychange", onHidden);
    };
  }, [startLevel, seedWord, mode, musical, startGame, quit, openReplay, closeReplay,
      seekTo, stepBy, playFrom, pausePlayback, setSpeed, resumeHere,
      showScores, openScores, closeScores, toggleSound, toggleMusical]);

  const g = gameRef.current;
  const rp = replayRef.current;
  const store = storeRef.current;

  // Die Bestenliste tritt an die Stelle von allem anderen, solange sie offen ist.
  if (showScores) {
    return html`<div class="app scores-view">
      <${ScoresScreen} store=${store} seed=${g ? g.seedWord : seedWord}
        nextSeed=${seedWord} level=${g ? g.startLevel : startLevel}
        mode=${g ? g.mode : mode}
        startLevel=${startLevel} running=${!!(g && !g.over)}
        onPlay=${playSeed} onPlayLevel=${playLevel} onClose=${closeScores} />
    </div>`;
  }

  // Die Wiedergabe zeigt statt des Spiels das aufgezeichnete Bild — samt Zahlen.
  if (rp && tapeRef.current.length) {
    const frames = tapeRef.current;
    const frame = frames[rp.index];
    const view = TetrisEngine.fromSnapshot(frame);
    return html`<div class=${"app replaying lv" + (view.level % 10)}>
      <aside class="panel left">
        <h2>Statistik</h2>
        <${Stats} stats=${view.stats} />
      </aside>

      <div class="center">
        <div class="stage">
          <${Board} game=${view} />
          <div class=${"replay-tag" + (frame.over ? " end" : "")}>
            ${frame.over ? "Game Over" : "Wiedergabe"}
          </div>
        </div>
        <${ReplayBar} frames=${frames} cur=${rp} canResume=${!frame.over}
          onSeek=${seekTo} onStep=${stepBy} onPlay=${playFrom} onPause=${pausePlayback}
          onSpeed=${setSpeed} onResume=${resumeHere} onClose=${closeReplay} />
      </div>

      <aside class="panel right">
        <${ScoreBox} game=${view} />
        <div class="box row">
          <div><h2>Level</h2><p class="big">${view.level}</p></div>
          <div><h2>Reihen</h2><p class="big">${view.lines}</p></div>
        </div>
        <div class="box">
          <h2>Nächster</h2>
          <${Preview} type=${view.nextType} />
        </div>
        <${ReplayKeys} />
      </aside>
    </div>`;
  }

  if (!g) {
    return html`<div class="app intro-view">
      <div class="stage intro">
        <${StartScreen} level=${startLevel} onLevel=${setStartLevel}
          mode=${mode} onMode=${setMode}
          musical=${musical} onMusical=${toggleMusical}
          seed=${seedWord} onSeed=${setSeedWord}
          summary=${mode === TetrisEngine.FOREVER
            ? TetrisScores.foreverSummaryFor(store, startLevel)
            : TetrisScores.summaryFor(store, seedWord)}
          onScores=${openScores} muted=${muted} onSound=${toggleSound}
          onStart=${() => startGame(startLevel, seedWord, mode, musical)} />
      </div>
    </div>`;
  }

  /* Nach dem Spielende zeigt die Einblendung, wo diese Partie unter den bisherigen
     steht — klassisch unter denen desselben Merkworts, endlos unter denen
     desselben Levels. */
  const forever = g.mode === TetrisEngine.FOREVER;
  const sum = g.over
    ? (forever ? TetrisScores.foreverSummaryFor(store, g.startLevel)
               : TetrisScores.summaryFor(store, g.seedWord))
    : null;
  const lastEntry = lastRef.current;
  const isRecord = !!(sum && lastEntry && sum.best === lastEntry);
  const rank = sum && lastEntry ? sum.entries.indexOf(lastEntry) + 1 : 0;

  return html`<div class=${"app lv" + (g.level % 10)}>
    <aside class="panel left">
      <h2>Statistik</h2>
      <${Stats} stats=${g.stats} />
    </aside>

    <div class="stage">
      <${Board} game=${g} />
      ${g.paused && html`<div class="overlay small">
        <h1>Pause</h1>
        <p class="hint">P zum Weiterspielen</p>
        <button class="start small" disabled=${!tapeRef.current.length}
          onClick=${openReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${openScores}>Bestenliste</button>
        <p class="hint">Taste R · Taste H</p></div>`}
      ${g.over && html`<div class="overlay small">
        <h1>Game Over</h1>
        ${forever
          ? html`<p class="lead">${TetrisScores.formatDuration(g.elapsed)} durchgehalten
              auf Level ${g.startLevel} · ${g.score} Punkte, ${g.lines} Reihen</p>`
          : html`<p class="lead">${g.score} Punkte, ${g.lines} Reihen</p>`}
        ${isRecord && sum.plays > 1 && html`<p class="record">
          ${forever ? "Neue Bestzeit für Level " + g.startLevel + "!" : "Neuer Bestwert für dieses Wort!"}</p>`}
        ${rank > 1 && html`<p class="hint">
          Platz ${rank} von ${sum.plays} · ${forever
            ? "Bestzeit " + TetrisScores.formatDuration(sum.best.duration)
            : "Bestwert " + sum.best.score}</p>`}
        <p class="hint seed-hint">Merkwort <b class="seed-word">${g.seedWord}</b></p>
        <button class="start" onClick=${() => startGame(g.startLevel, g.seedWord, g.mode, g.musical)}>Noch einmal</button>
        <button class="start small" disabled=${!tapeRef.current.length}
          onClick=${openReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${openScores}>Bestenliste</button>
        <p class="hint">Enter dieselbe Folge · R Aufzeichnung · H Bestenliste · Esc zurück</p></div>`}
    </div>

    <aside class="panel right">
      <${ScoreBox} game=${g} />
      <div class="box row">
        <div><h2>Level</h2><p class="big">${g.level}</p></div>
        <div><h2>Reihen</h2><p class="big">${g.lines}</p></div>
      </div>
      <div class="box">
        <h2>Nächster</h2>
        <${Preview} type=${g.nextType} />
      </div>
      ${g.musical && html`<${ChordBox} game=${g} />`}
      <div class="box">
        <h2>Merkwort</h2>
        <p class="seed-word">${g.seedWord}</p>
        ${forever && html`<p class="mode-line">∞ Endlos · Level ${g.startLevel} bleibt</p>`}
      </div>
      <div class="box keys">
        <h2>Tasten</h2>
        <p><kbd>←</kbd><kbd>→</kbd> verschieben</p>
        <p><kbd>A</kbd><kbd>D</kbd> drehen</p>
        <p><kbd>↓</kbd> ein Feld tiefer</p>
        <p><kbd>Leer</kbd> fallen lassen</p>
        <p><kbd>P</kbd> Pause · <kbd>Esc</kbd> Ende</p>
        <p><kbd>S</kbd> Ton ${muted ? "aus" : "an"} · <kbd>T</kbd> Ton prüfen</p>
        ${forever && html`<p><kbd>K</kbd> Musik ${g.musical ? "an — Geräusche still" : "aus"}</p>`}
        <p><kbd>R</kbd> Aufzeichnung (in Pause)</p>
        <p><kbd>H</kbd> Bestenliste (in Pause)</p>
      </div>
    </aside>
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
<script>/* Die Ton-Diagnose. Taste T öffnet und schließt sie, überall in der App.

   Sie greift nicht ein, sie liest nur ab: was sound.js über jeden der vier Klänge
   weiß — ob sein Element im Dokument steht, ob seine Quelle eingebettet wurde, was
   das Entpacken ergab, welcher Weg zuletzt getragen hat und woran der letzte
   Versuch scheiterte. Dazu je Klang zwei Knöpfe, die ihn auf der Stelle spielen:
   einmal die ganze Kette, einmal nur den eigenen Ton.

   Der Klick ist dabei mehr als Bequemlichkeit: Er ist die stärkste Zustimmung des
   Anwenders, die der Browser kennt. Was auf Knopfdruck stumm bleibt, bleibt nicht
   wegen fehlender Zustimmung stumm.

   Darunter stehen die beiden Wege, auf denen eine Aufnahme in die App kommt: die
   Beigaben aus dem Ordner assets, die das Bündeln einsetzt (soundassets.js), und
   als Netz darunter der Datenordner (soundfiles.js). Dort kommen Dateien auch
   herein — der Anwender wählt sie im Dateidialog oder lässt sie über dem Fenster
   fallen; gesichert werden sie danach im Datenordner.

   Sie hängt an einer eigenen Wurzel (#diag) und liegt damit über jeder Ansicht,
   ohne dass eine davon etwas von ihr wissen muss. */

// Was die Zahlen des Elements bedeuten — in Worten statt in Kennziffern.
const DIAG_READY = ["nichts", "Metadaten", "erste Daten", "läuft durch", "vollständig"];
const DIAG_NET = ["leer", "im Leerlauf", "lädt", "keine Quelle"];
const DIAG_ERR = { 1: "abgebrochen", 2: "Netzfehler", 3: "nicht entschlüsselbar",
                   4: "Quelle nicht unterstützt" };
const DIAG_NAMES = { move: "Schieben / Drehen", drop: "Aufsetzen",
                     rows: "Reihe voll", tetris: "Tetris" };

function SoundDiagRow({ s }) {
  // Grün, solange etwas getragen hat; rot, wo der Weg nachweislich zu ist.
  const bad = !s.found || s.error > 0 || s.way === "stumm";
  const ok = s.way === "Element" || s.way === "Tonmaschine";
  return html`<tr class=${bad ? "bad" : ok ? "ok" : ""}>
    <td class="name">${DIAG_NAMES[s.key] || s.key}</td>
    <td>${s.file ? "Datei: " + s.file
      : !s.found ? "fehlt"
      : s.embedded ? "eingebettet " + s.kb + " KB"
      : s.src ? "Pfad: " + s.src : "ohne Quelle"}</td>
    <td>${s.found ? (DIAG_READY[s.ready] || s.ready) + " · " + (DIAG_NET[s.net] || s.net) : "—"}
      ${s.error > 0 && html`<b> · ${DIAG_ERR[s.error] || "Fehler " + s.error}</b>`}</td>
    <td>${s.decode}</td>
    <td class="way">${s.way}${s.voices ? " (" + s.voices + ")" : ""}</td>
    <td class="note">${s.note || "—"}</td>
    <td class="act">
      <button onClick=${() => TetrisSound.test(s.key)}>▶ Datei</button>
      <button onClick=${() => TetrisSound.test(s.key, "tone")}>▶ Ton</button>
    </td>
  </tr>`;
}

/* Die Beigaben (soundassets.js): was das Bündeln an ihrer Stelle eingesetzt hat.

   Das ist der Weg, der ohne Zutun des Anwenders trägt. Steht hier überall
   „übernommen“, braucht es den Block darunter gar nicht — er ist dann nur noch das
   Netz für den Fall, dass eine Aufnahme nicht eingebettet wurde. */
function SoundAssetsBlock() {
  const r = TetrisSoundAssets.report();
  const keys = ["move", "drop", "rows", "tetris"];
  return html`<div class="diag-files">
    <h3>Beigaben aus assets <span>${r.note}</span></h3>
    <ul>
      ${keys.map((k) => {
        const f = r.found[k];
        const good = !!f && f.state === "übernommen";
        const bits = [r.files[k]];
        if (f) {
          if (f.kb) bits.push(f.kb + " KB");
          if (f.way) bits.push(f.way);
          bits.push(f.state);
        } else {
          bits.push("noch nicht gelesen");
        }
        return html`<li key=${k} class=${good ? "ok" : f ? "bad" : ""}>
          <b>${DIAG_NAMES[k]}</b>
          <span>${bits.join(" · ")}</span>
        </li>`;
      })}
    </ul>
    <p class="diag-hint">Beim Bündeln setzt Morphos an der Stelle einer Beigabe die
      Aufnahme selbst ein — hier am <i>source</i> des Klang-Elements. Steht hier
      <i>nicht eingebettet</i>, ist der Pfad stehen geblieben; dann hilft nur der
      Weg über den Datenordner darunter.</p>
    <button class="diag-again"
      onClick=${() => TetrisSoundAssets.read()}>Noch einmal lesen</button>
  </div>`;
}

/* Die Aufnahmen (soundfiles.js): was übernommen wurde, was fehlt und woran es lag.

   Von hier aus kommen die Dateien auch herein. Die vier Aufnahmen liegen im Ordner
   assets neben der App — dorthin reicht der Arm der App nicht, sie sieht nur den
   Datenordner. Der Anwender aber kann sie ihr geben: im Dateidialog des Browsers
   oder indem er sie über dem Fenster fallen lässt. Was so ankommt, klingt sofort
   und wird zugleich im Datenordner gesichert. */

// Womit der Dateidialog aufmacht — Tonformen und die base64-Textfassung.
const DIAG_ACCEPT = "audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.txt,.b64";

// Was von einer Aufnahme zu sagen ist — nur, was auch dasteht.
function fileLine(f) {
  if (!f) return "noch keine Aufnahme";
  const bits = [f.name];
  if (f.kb) bits.push(f.kb + " KB");
  if (f.how) bits.push(f.how);
  bits.push(f.state);
  return bits.join(" · ");
}

/* Aus dem Ereignis eines Dateifelds die Dateien holen. Kopiert wird sofort in ein
   Feld: Das Zurücksetzen des Felds leert seine Liste, und die Übernahme läuft
   danach noch eine Weile weiter. */
function filesOf(e) {
  const list = Array.prototype.slice.call(e.target.files || []);
  e.target.value = "";
  return list;
}

function SoundFilesBlock({ onDone }) {
  const { useState } = preactHooks;
  const [busy, setBusy] = useState("");
  const [over, setOver] = useState(false);
  const r = TetrisSoundFiles.report();
  const keys = ["move", "drop", "rows", "tetris"];

  async function takeOne(key, file) {
    if (!file) return;
    setBusy(key);
    try { await TetrisSoundFiles.intakeAs(key, file); }
    catch (err) { /* der Vermerk der Aufnahme sagt es */ }
    finally { setBusy(""); onDone(); }
  }

  async function takeMany(list) {
    if (!list.length) return;
    setBusy("alle");
    try { await TetrisSoundFiles.intake(list); }
    catch (err) { /* der Vermerk sagt es */ }
    finally { setBusy(""); onDone(); }
  }

  /* Das Fallenlassen hier drin ist dasselbe wie überall im Fenster — nur bleibt es
     hier stehen, damit es nicht zweimal übernommen wird. */
  function onDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    setOver(false);
    takeMany(Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []));
  }

  return html`<div class="diag-files">
    <h3>Aufnahmen aus dem Datenordner
      <span>${busy === "alle" ? "wird übernommen …" : r.note}</span></h3>
    <div class=${"diag-drop" + (over ? " over" : "")}
      onDragOver=${(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave=${(e) => {
        // Der Wechsel auf ein Kind meldet sich auch als Verlassen — er zählt nicht.
        if (e.relatedTarget && e.currentTarget.contains(e.relatedTarget)) return;
        setOver(false);
      }}
      onDrop=${onDrop}>
      <b>Aufnahmen hierher ziehen</b>
      <label class="diag-take">Dateien wählen …
        <input type="file" multiple accept=${DIAG_ACCEPT}
          onChange=${(e) => takeMany(filesOf(e))} />
      </label>
    </div>
    <p class="diag-hint">Der Notweg, falls oben etwas <i>nicht eingebettet</i>
      ist: dieselben vier Dateien aus dem Ordner <b>assets</b> von Hand hereingeben
      — <i>move-and-turn-shorter</i>, <i>drop-sound</i>, <i>row-completed-sound</i>,
      <i>tetris-sound</i>. Wähle sie alle auf einmal; welcher Klang gemeint ist,
      verrät der Name. ${r.fs
        ? html`Danach liegen sie gesichert in <b>${r.dir}</b> im Datenordner und
            klingen bei jedem Start von selbst.`
        : html`<b>Es ist kein Datenordner festgelegt</b> — sie klingen dann nur in
            dieser Sitzung und müssen beim nächsten Start erneut gewählt werden.`}</p>
    <ul>
      ${keys.map((k) => {
        const f = r.files[k];
        const good = !!f && f.ok;
        return html`<li key=${k} class=${good ? "ok" : f ? "bad" : ""}>
          <b>${DIAG_NAMES[k]}</b>
          <span>${fileLine(f)}</span>
          <label class=${"diag-take" + (busy === k ? " busy" : "")}>
            ${busy === k ? "…" : "Datei wählen"}
            <input type="file" accept=${DIAG_ACCEPT}
              onChange=${(e) => takeOne(k, filesOf(e)[0])} />
          </label>
        </li>`;
      })}
    </ul>
    <button class="diag-again"
      onClick=${() => TetrisSoundFiles.scan().then(onDone, () => {})}>Im Datenordner
      suchen</button>
  </div>`;
}

function SoundDiag() {
  const { useState, useEffect } = preactHooks;
  const [open, setOpen] = useState(false);
  const [, bump] = useState(0);

  // Taste T — aber nicht, während der Anwender ein Merkwort tippt.
  useEffect(() => {
    function onKey(e) {
      if (e.target && e.target.tagName === "INPUT") return;
      if (e.repeat) return;
      /* Nur T — Esc gehört dem Spiel (Aufgeben, Liste schließen) und würde sonst
         zweierlei zugleich tun. */
      if (e.key === "t" || e.key === "T") setOpen((o) => !o);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  /* Aufnahmen darf man überall über dem Fenster fallen lassen, nicht nur hier: Die
     Tafel geht dann von selbst auf und zeigt, was daraus wurde. Ohne das
     Abfangen zeigte der Rahmen die Datei bloß an, statt sie zu übernehmen. */
  useEffect(() => {
    function hasFiles(e) {
      const t = e.dataTransfer && e.dataTransfer.types;
      return !!t && Array.prototype.indexOf.call(t, "Files") >= 0;
    }
    function onOver(e) { if (hasFiles(e)) e.preventDefault(); }
    function onDrop(e) {
      if (!hasFiles(e)) return;
      e.preventDefault();
      const list = Array.prototype.slice.call(e.dataTransfer.files || []);
      if (!list.length) return;
      setOpen(true);
      TetrisSoundFiles.intake(list).then(() => bump((v) => v + 1), () => {});
    }
    window.addEventListener("dragover", onOver);
    window.addEventListener("drop", onDrop);
    return () => {
      window.removeEventListener("dragover", onOver);
      window.removeEventListener("drop", onDrop);
    };
  }, []);

  // Solange sie offen ist, liest sie sich viermal je Sekunde neu ab.
  useEffect(() => {
    if (!open) return;
    const id = setInterval(() => bump((v) => v + 1), 250);
    return () => clearInterval(id);
  }, [open]);

  if (!open) return null;
  const r = TetrisSound.report();

  return html`<div class="diag">
    <div class="diag-box">
      <div class="diag-head">
        <h2>Ton-Diagnose</h2>
        <span class="diag-ctx">Tonmaschine: <b>${r.ctx}</b> · Uhr ${r.clock}s
          · Ton ${r.muted ? "aus" : "an"}</span>
        <button class="diag-close" onClick=${() => setOpen(false)}>Schließen</button>
      </div>
      ${r.muted && html`<p class="diag-warn">Der Ton ist abgeschaltet —
        <kbd>S</kbd> schaltet ihn an. Solange bleibt auch die Probe stumm.</p>`}
      <table>
        <thead><tr>
          <th>Klang</th><th>Quelle</th><th>Element</th><th>Entpacken</th>
          <th>zuletzt über</th><th>Vermerk</th><th></th>
        </tr></thead>
        <tbody>
          ${r.sounds.map((s) => html`<${SoundDiagRow} key=${s.key} s=${s} />`)}
        </tbody>
      </table>
      <${SoundAssetsBlock} />
      <${SoundFilesBlock} onDone=${() => bump((v) => v + 1)} />
      <p class="diag-hint">Ein Klang geht drei Wege, bis einer trägt:
        <b>Element</b> → <b>Tonmaschine</b> → <b>eigener Ton</b>. Liegt eine
        Aufnahme aus dem Datenordner bereit, klingt sie zuerst. Steht in
        „zuletzt über“ noch <i>noch nichts</i>, war dieser Klang noch nicht
        fällig. <kbd>T</kbd> schließt wieder.</p>
    </div>
  </div>`;
}

preact.render(html`<${SoundDiag} />`, document.getElementById("diag"));
</script>
</body>
</html>
