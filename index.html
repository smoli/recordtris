    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  /* Wo der Klang wirklich anfängt: der erste Ausschlag über der Hörschwelle. Ein
     Stück davor bleibt stehen, damit der Einsatz nicht abgeschnitten klingt. */
  function firstSound(buf) {
    const data = buf.getChannelData(0);
    const limit = Math.min(data.length, Math.floor(buf.sampleRate * 0.5));
    for (let i = 0; i < limit; i++) {
      if (data[i] > 0.004 || data[i] < -0.004) {
        return Math.max(0, (i - buf.sampleRate * 0.002) / buf.sampleRate);
      }
    }
    return 0;
  }

  /* Die Quelle eines Klangs im Dokument. Sie steht nicht am Element selbst,
     sondern an seinem <source>-Kind — das ist die Schreibweise, an der das Bündeln
     eine Beigabe erkennt. Ein eigenes src hat trotzdem Vorrang: Es entsteht später
     beim Übernehmen einer Aufnahme und ist dann das Gültige. */
  function srcOf(el) {
    if (!el) return "";
    const own = el.getAttribute("src");
    if (own) return own;
    const s = el.querySelector ? el.querySelector("source") : null;
    return (s && s.getAttribute("src")) || "";
  }

  function decodeInto(bank, src) {
    const buffer = bytesOf(src);
    if (!buffer) {
      bank.dec = !src ? "keine Quelle"
        : src.slice(0, 5) === "data:" ? "nicht base64" : "nicht eingebettet";
      return;
    }
    decodeBuffer(bank, buffer, "");
  }

  /* Die nackten Bytes einer Aufnahme entpacken — gleich, woher sie stammen: aus
     dem Dokument oder aus dem Datenordner. Das Entpacken frisst den Puffer auf;
     wer ihn noch braucht, bedient sich vorher. */
  function decodeBuffer(bank, buffer, label) {
    if (!ctx || !ctx.decodeAudioData) { bank.dec = "keine Tonmaschine"; return; }
    bank.dec = "läuft";
    // Die alte Form gibt kein Versprechen zurück, sondern ruft zurück.
    let p;
    try { p = ctx.decodeAudioData(buffer, ok, fail); }
    catch (e) { bank.dec = "wirft " + (e && e.name ? e.name : "?"); return; }
    if (p && p.then) p.then(ok, fail);
    function ok(buf) {
      if (!buf) return;
      bank.buf = buf;
      bank.skip = firstSound(buf);
      bank.dec = "entpackt" + (label ? " (" + label + ")" : "");
    }
    function fail() { bank.dec = "misslungen" + (label ? " (" + label + ")" : ""); }
  }

  // --- Eine Aufnahme von außen ---

  /* Die Bytes einer Datei aus dem Datenordner (soundfiles.js) — das Netz für den
     Fall, dass das Bündeln die Beigabe nicht ins Dokument gesetzt hat und dort
     bloß ein Pfad steht, der hier nirgendwohin führt.

     Beide Wege werden damit gangbar — der Klangkörper in der Tonmaschine (dafür
     wird entpackt) und das Element (dafür wird die Datei zur data:-Quelle). */
  function adopt(key, buffer, mime, label) {
    build();
    const bank = banks[key];
    if (!bank || !buffer || !buffer.byteLength) return false;
    bank.file = label || "Datei";
    bank.note = "";
    openCtx();
    feedVoices(bank, buffer, mime);      // erst der data:-Umweg …
    decodeBuffer(bank, buffer, "Datei"); // … dann das Entpacken, das den Puffer frisst
    return true;
  }

  const MAX_INLINE = 3 * 1024 * 1024; // darüber lohnt die data:-Quelle nicht mehr

  /* Aus den Bytes eine data:-Quelle machen und sie den Stimmen geben. Das ist der
     Weg, der auch ohne wache Tonmaschine trägt. Ein neues src löscht den Fehler
     des Elements — der alte Pfad ist damit vergessen. */
  function feedVoices(bank, buffer, mime) {
    if (!bank.voices.length || buffer.byteLength > MAX_INLINE) return;
    const bytes = new Uint8Array(buffer);
    let bin = "";
    // In Häppchen, sonst sprengt der Aufruf bei großen Dateien den Stapel.
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    let uri;
    try { uri = "data:" + (mime || "audio/mpeg") + ";base64," + btoa(bin); }
    catch (e) { return; }
    setVoiceSrc(bank, uri);
  }

  /* Eine fertige data:-Quelle allen Stimmen geben. Ein neues src löscht den Fehler
     des Elements — der alte Pfad ist damit vergessen. */
  function setVoiceSrc(bank, uri) {
    for (let i = 0; i < bank.voices.length; i++) {
      const v = bank.voices[i];
      try { v.src = uri; v.volume = bank.def.vol; v.load(); } catch (e) {}
    }
  }

  /* Eine Aufnahme, die schon als data:-Quelle vorliegt — so kommen die Beigaben
     aus dem Ordner assets herein (soundassets.js): Das Bündeln hat sie an ihrer
     Stelle im Dokument eingesetzt, gelesen werden sie dort einfach ab. Der Umweg
     über btoa entfällt damit; entpackt wird trotzdem, damit auch die Tonmaschine
     ihren Klangkörper hat. */
  function adoptUri(key, uri, label) {
    build();
    const bank = banks[key];
    if (!bank || !uri || uri.slice(0, 5) !== "data:") return false;
    const buffer = bytesOf(uri);
    if (!buffer) return false;
    bank.file = label || "Beigabe";
    bank.note = "";
    openCtx();
    setVoiceSrc(bank, uri);
    decodeBuffer(bank, buffer, "Beigabe");
    return true;
  }

  // Liegt für diesen Klang schon eine Aufnahme? Dann sucht soundfiles.js keine mehr.
  function hasRecording(key) {
    return !!(banks[key] && banks[key].file);
  }

  // --- Der Aufbau ---

  /* Jeder Klang bekommt seine Bank gleich beim Laden — auch dann, wenn sein
     Element noch fehlt. Denn ohne Bank gäbe es nichts zu spielen, und dann wäre
     es für immer still; mit Bank bleibt wenigstens der eigene Ton.

     Die Stimmen sind Kopien des Elements, damit ein Ton den vorigen nicht
     abschneidet. Sie tragen die Quelle des Vorbilds mit sich und müssen nicht im
     Dokument hängen, um zu klingen. Fehlte das Element beim Laden noch, wird bei
     jedem Anschlag erneut nach ihm gesucht. */
  function build() {
    openCtx();
    for (const key in DEFS) {
      const def = DEFS[key];
      let bank = banks[key];
      if (!bank) {
        bank = banks[key] = { key: key, def: def, voices: [], at: 0,
                              last: -1e9, buf: null, skip: 0, file: "",
                              way: "noch nichts", note: "", dec: "—" };
      }
      if (bank.voices.length) continue;
      const el = document.getElementById(def.id);
      if (!el) { bank.note = "Element " + def.id + " fehlt im Dokument"; continue; }
      for (let i = 0; i < def.voices; i++) {
        const v = i === 0 ? el : el.cloneNode(true);
        v.preload = "auto";
        v.volume = def.vol;
        if (v !== el) v.load(); // die Kopie soll bereitstehen, bevor sie gebraucht wird
        bank.voices.push(v);
      }
      bank.note = "";
      decodeInto(bank, srcOf(el));
    }
    if (ctx) addWatchers();
  }

  // --- Die drei Wege ---

  /* Ein Element, dessen Quelle nicht spielbar ist, wird nicht erst gefragt: Es
     meldet einen Fehler oder hat gar keine Quelle. Dann geht es gleich weiter. */
  function voiceOf(bank) {
    if (!bank.voices.length) return null;
    const v = bank.voices[bank.at];
    bank.at = (bank.at + 1) % bank.voices.length;
    if (v.error) {
      bank.note = "Quelle nicht spielbar (Fehler " + v.error.code + ")";
      return null;
    }
    if (v.networkState === NO_SOURCE) {
      bank.note = "keine spielbare Quelle";
      return null;
    }
    return v;
  }

  function playElement(bank, i) {
    const v = voiceOf(bank);
    if (!v) return false;
    try { v.currentTime = 0; } catch (e) { /* noch nicht bereit — dann von vorn */ }
    let p;
    try { p = v.play(); }
    catch (e) { bank.note = "play() wirft " + (e && e.name ? e.name : "?"); return false; }
    bank.way = "Element";
    bank.note = "";
    // Weist es erst nachträglich ab, übernimmt noch derselbe Anschlag den nächsten Weg.
    if (p && p.catch) p.catch(function (e) {
      bank.note = "play() abgewiesen: " + (e && e.name ? e.name : "?");
      fire(bank, i + 1);
    });
    return true;
  }

  // Über die Tonmaschine: eine neue Stimme je Anschlag, sofort und ohne Anlauf.
  function playBuffered(bank) {
    if (!ctx || !master || !bank.buf || ctx.state !== "running") return false;
    let src;
    try {
      src = ctx.createBufferSource();
      src.buffer = bank.buf;
      const gain = ctx.createGain();
      gain.gain.value = bank.def.vol;
      src.connect(gain);
      gain.connect(master);
    } catch (e) { return false; }
    src.onended = function () {
      const k = live.indexOf(src);
      if (k >= 0) live.splice(k, 1);
    };
    live.push(src);
    try { src.start(0, bank.skip); }
    catch (e) { try { src.start(0); } catch (e2) { return false; } }
    bank.way = "Tonmaschine";
    return true;
  }

  /* Der Notnagel: ein kurzer eigener Ton. Er klingt nur, wenn die Aufnahme fehlt
     oder abweist — und nur, solange die Tonmaschine wach ist. */
  function playTone(bank) {
    if (!ctx || !master || ctx.state !== "running") return false;
    const t = bank.def.tone;
    if (!t) return false;
    const t0 = ctx.currentTime + 0.001;
    const peak = t.vol / Math.sqrt(t.freqs.length);
    for (let i = 0; i < t.freqs.length; i++) {
      const at = t0 + (t.step ? i * t.step : 0);
      let osc;
      try {
        osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = t.wave || "triangle";
        osc.frequency.setValueAtTime(t.freqs[i], at);
        if (t.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, t.to), at + t.dur);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(peak, at + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + t.dur);
        osc.connect(gain);
        gain.connect(master);
        osc.start(at);
        osc.stop(at + t.dur + 0.02);
      } catch (e) {
        // Ein Teil des Akkords klingt schon — dann gilt der Weg als getragen.
        if (i > 0) { bank.way = "eigener Ton"; return true; }
        return false;
      }
      osc.onended = function () {
        const k = live.indexOf(osc);
        if (k >= 0) live.splice(k, 1);
      };
      live.push(osc);
    }
    bank.way = "eigener Ton";
    return true;
  }

  /* Liegt eine entpackte Aufnahme bereit, klingt sie zuerst: Über die Tonmaschine
     geht es ohne Anlauf, das Element bleibt der Rückfall. Ohne Aufnahme bleibt es
     bei der gewohnten Ordnung. Der eigene Ton steht so oder so am Ende — test()
     verlässt sich darauf. */
  function waysFor(bank) {
    return bank.buf ? ["buffer", "element", "tone"] : WAYS;
  }

  /* Der erste Weg, der trägt, gewinnt. Trägt keiner, bleibt es bei diesem
     Anschlag still — und der Klang vermerkt, warum. */
  function fire(bank, i) {
    const ways = waysFor(bank);
    while (i < ways.length) {
      const way = ways[i];
      if (way === "element" && playElement(bank, i)) return;
      if (way === "buffer" && playBuffered(bank)) return;
      if (way === "tone" && playTone(bank)) return;
      i++;
    }
    bank.way = "stumm";
  }

  /* Ein Anschlag, ohne Rücksicht auf den Mindestabstand — er ist hier schon
     entschieden. */
  function strike(bank) {
    bank.last = now();
    /* Die Tonmaschine schläft, bis der Anwender etwas tut — der Tastendruck selbst
       weckt sie. In manchem Fensterrahmen darf sie nie erwachen; die Wege, die auf
       sie bauen, kommen dann nie zum Zug, das Element aber schon. */
    if (ctx && ctx.state !== "running") unlock();
    fire(bank, 0);
  }

  function play(key) {
    if (muted) return;
    build();
    const bank = banks[key];
    if (!bank) return;
    if (now() - bank.last < bank.def.gap) return;
    strike(bank);
  }

  /* Derselbe Klang mehrmals kurz hintereinander: je Anlass ein Anschlag, um
     spacing Millisekunden versetzt. So klingen mehrere volle Reihen nicht als
     ein Ton, sondern gestaffelt — eine je Reihe. Der Mindestabstand gilt dabei
     nicht, die Folge ist ja gewollt; wer inzwischen abschaltet, hört den Rest
     nicht mehr. */
  function series(key, count, spacing) {
    if (muted) return;
    build();
    const bank = banks[key];
    if (!bank) return;
    const n = Math.max(1, count | 0);
    const step = spacing > 0 ? spacing : 110;
    strike(bank);
    for (let i = 1; i < n; i++) {
      setTimeout(function () { if (!muted) strike(bank); }, i * step);
    }
  }

  // Abschalten heißt auch: was gerade klingt, hört auf.
  function stopAll() {
    for (let i = 0; i < live.length; i++) {
      try { live[i].stop(); } catch (e) {}
    }
    live = [];
    for (const key in banks) {
      const voices = banks[key].voices;
      for (let i = 0; i < voices.length; i++) {
        try { voices[i].pause(); voices[i].currentTime = 0; } catch (e) {}
      }
    }
  }

  function setMuted(m) {
    muted = !!m;
    if (master) master.gain.value = muted ? 0 : 1;
    if (muted) stopAll();
  }

  // --- Was der Ton gerade tut ---

  /* Offengelegt für die Diagnose: je Klang, ob sein Element da ist, ob seine
     Quelle eingebettet wurde, was das Entpacken ergab und welcher Weg zuletzt
     getragen hat. Nur Ablesen, kein Eingriff. */
  function report() {
    const sounds = [];
    for (const key in DEFS) {
      const def = DEFS[key];
      const bank = banks[key] || null;
      const el = document.getElementById(def.id);
      const src = srcOf(el);
      const embedded = src.slice(0, 5) === "data:";
      sounds.push({
        key: key,
        found: !!el,
        embedded: embedded,
        kb: embedded ? Math.round(src.length * 0.75 / 1024) : 0,
        src: embedded ? "" : src,
        ready: el ? el.readyState : -1,
        net: el ? el.networkState : -1,
        error: el && el.error ? el.error.code : 0,
        voices: bank ? bank.voices.length : 0,
        file: bank ? bank.file : "",
        decode: bank ? bank.dec : "—",
        way: bank ? bank.way : "—",
        note: bank ? bank.note : ""
      });
    }
    return {
      muted: muted,
      ctx: ctx ? ctx.state : "keine",
      clock: ctx ? Math.round(ctx.currentTime * 100) / 100 : 0,
      sounds: sounds
    };
  }

  /* Ein Klang auf Verlangen — ohne Mindestabstand. Mit way = "tone" wird nur der
     eigene Ton versucht, sonst die ganze Kette von vorn. */
  function test(key, way) {
    if (muted) return;
    build();
    const bank = banks[key];
    if (!bank) return;
    bank.last = -1e9;
    if (ctx && ctx.state !== "running") unlock();
    fire(bank, way === "tone" ? WAYS.indexOf("tone") : 0);
  }

  // Die Bänke entstehen gleich beim Laden — dann klingt schon der erste Zug.
  build();

  return {
    play: play,
    series: series,
    adopt: adopt,
    adoptUri: adoptUri,
    bus: bus,
    wake: function () { if (ctx && ctx.state !== "running") unlock(); },
    has: hasRecording,
    setMuted: setMuted,
    report: report,
    test: test
  };
})();
</script>
<script>/* Das Klangbett des Endlosspiels: Jeder Stein ist eine Stufe der Tonart.

   Erscheint ein Stein, klingt sein Akkord als weiches Pad — es bleibt stehen,
   bis der nächste Stein kommt, und wird dann abgelöst (der alte klingt aus,
   während der neue anschwillt). Die Steinfolge des Zufallsregisters wird damit
   zu einer Akkordfolge; wer dasselbe Merkwort spielt, hört dieselbe Musik.

   Die Zuordnung ist fest und stammt vom Anwender:
     I → I,  S → IV,  O → II,  Z → III,  T → V,  J → VI,  L → VII.
   Die Tonart ist F-Dur; die Stufen sind ihre Dreiklänge, dazu ein Bass eine
   Oktave unter dem Grundton.

   Geklungen wird über die Tonmaschine von sound.js — dieselbe, die auch die
   Aufnahmen entpackt. Das Pad hängt an deren Regler und ist damit von der
   Stummschaltung (Taste S) mit erfasst, ohne dass es davon wissen muss.

   Ausgelöst wird es dort, wo sein Anlass entsteht: in engine.js beim Erscheinen
   eines Steins. Was hier steht, klingt nur — es kennt das Spiel nicht. */
const TetrisPad = (function () {
  const KEY_NAME = "F-Dur";
  const ROOT = 174.6141; // F3 — der Grundton der Tonart

  /* Je Steinsorte die Stufe: ihr Name, ihr Zeichen und die Halbtonschritte des
     Dreiklangs über dem Grundton der Tonart (F=0, G=2, A=4, B♭=5, C=7, D=9, E=11).
     Die Lagen steigen mit der Stufe — als Pad trägt das besser als ein Sprung
     zurück in die tiefe Oktave. */
  const CHORDS = {
    I: { deg: "I",   name: "F-Dur",       semis: [0, 4, 7] },
    O: { deg: "II",  name: "g-Moll",      semis: [2, 5, 9] },
    Z: { deg: "III", name: "a-Moll",      semis: [4, 7, 11] },
    S: { deg: "IV",  name: "B♭-Dur",      semis: [5, 9, 12] },
    T: { deg: "V",   name: "C-Dur",       semis: [7, 11, 14] },
    J: { deg: "VI",  name: "d-Moll",      semis: [9, 12, 16] },
    L: { deg: "VII", name: "e-vermindert", semis: [11, 14, 17] }
  };

  const LEVEL = 0.13;   // wie laut das Bett insgesamt steht
  const ATTACK = 0.45;  // wie lange es anschwillt
  const RELEASE = 0.85; // wie lange die abgelöste Farbe ausklingt

  let voice = null;     // was gerade steht
  let voiceType = "";   // welcher Stein es ausgelöst hat
  let fading = [];      // was gerade ausklingt — damit stop() auch das erwischt

  // Die Tonmaschine liegt bei sound.js; ohne sie bleibt das Pad einfach stumm.
  function bus() {
    if (typeof TetrisSound === "undefined" || !TetrisSound.bus) return null;
    const b = TetrisSound.bus();
    return b && b.ctx && b.master ? b : null;
  }

  /* Ein Akkord als Klangkörper: ein Bass und drei Töne, jeder aus zwei leicht
     gegeneinander verstimmten Stimmen, alles durch ein weiches Tiefpassfilter,
     das beim Einsetzen langsam aufgeht. Das ergibt das Schweben eines Pads. */
  function build(ctx, dest, spec) {
    const t0 = ctx.currentTime + 0.01;
    const out = ctx.createGain();
    /* Erst der stille Grundwert, dann das Anschwellen: Wird die Farbe abgelöst,
       bevor sie überhaupt eingesetzt hat, fällt das Anschwellen weg — und was
       bleibt, ist die Stille, kein Sprung auf volle Lautstärke. */
    out.gain.value = 0.0001;
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(LEVEL, t0 + ATTACK);

    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.Q.value = 0.7;
    filt.frequency.setValueAtTime(480, t0);
    filt.frequency.linearRampToValueAtTime(1700, t0 + ATTACK * 1.7);
    filt.connect(out);
    out.connect(dest);

    const notes = [spec.semis[0] - 12].concat(spec.semis); // Bass, dann der Dreiklang
    const oscs = [];
    for (let i = 0; i < notes.length; i++) {
      const freq = ROOT * Math.pow(2, notes[i] / 12);
      const bass = i === 0;
      const detunes = bass ? [0] : [-6, 6];
      for (let d = 0; d < detunes.length; d++) {
        let osc, gain;
        try {
          osc = ctx.createOscillator();
          gain = ctx.createGain();
        } catch (e) { break; }
        osc.type = bass ? "triangle" : "sawtooth";
        osc.frequency.setValueAtTime(freq, t0);
        osc.detune.setValueAtTime(detunes[d], t0);
        gain.gain.value = (bass ? 0.55 : 0.30) / detunes.length;
        osc.connect(gain);
        gain.connect(filt);
        try { osc.start(t0); } catch (e) { continue; }
        oscs.push(osc);
      }
    }
    if (!oscs.length) { try { out.disconnect(); } catch (e) {} return null; }
    return { ctx: ctx, out: out, oscs: oscs };
  }

  /* Eine Farbe ausklingen lassen: leiser werden, dann verstummen. Sie wandert
     dabei in die Liste des Ausklingens, damit ein hartes Anhalten sie noch
     erreicht. */
  function release(v, quick) {
    if (!v) return;
    fade(v, quick ? 0.08 : RELEASE);
    fading.push(v);
    const last = v.oscs[v.oscs.length - 1];
    last.onended = function () {
      const k = fading.indexOf(v);
      if (k >= 0) fading.splice(k, 1);
      try { v.out.disconnect(); } catch (e) {}
    };
  }

  // Leiser werden und danach verstummen — die Bewegung selbst, ohne Buchführung.
  function fade(v, dur) {
    const t = v.ctx.currentTime;
    try {
      /* Anhalten, ohne zurückzuspringen: Ein noch laufendes Anschwellen wird
         dort festgehalten, wo es gerade steht — von da an geht es abwärts. */
      if (v.out.gain.cancelAndHoldAtTime) v.out.gain.cancelAndHoldAtTime(t);
      else {
        v.out.gain.cancelScheduledValues(t);
        v.out.gain.setValueAtTime(Math.max(0.0001, v.out.gain.value), t);
      }
      v.out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } catch (e) {}
    for (let i = 0; i < v.oscs.length; i++) {
      try { v.oscs[i].stop(t + dur + 0.05); } catch (e) {}
    }
  }

  /* Der Akkord eines Steins. Er löst den vorigen ab — auch derselbe Stein
     zweimal hintereinander setzt neu an, denn er ist ein neuer Anschlag. */
  function chord(type) {
    const spec = CHORDS[type];
    if (!spec) return false;
    const b = bus();
    if (!b) return false;
    if (TetrisSound.wake) TetrisSound.wake();
    release(voice, false);
    voice = build(b.ctx, b.master, spec);
    voiceType = voice ? type : "";
    return !!voice;
  }

  // Alles verstummt — beim Pausieren, beim Spielende, beim Verlassen der Partie.
  function stop() {
    release(voice, true);
    voice = null;
    voiceType = "";
    // Auch was schon ausklingt, wird kurzgemacht — sonst hallt die Partie nach.
    for (let i = fading.length - 1; i >= 0; i--) fade(fading[i], 0.08);
  }

  // Für die Anzeige: welche Stufe ein Stein ist, und wie die Tonart heißt.
  function chordOf(type) { return CHORDS[type] || null; }
  function keyName() { return KEY_NAME; }
  function playing() { return voiceType; }

  return {
    chord: chord,
    stop: stop,
    chordOf: chordOf,
    keyName: keyName,
    playing: playing
  };
})();
</script>
<script>/* Die vier Aufnahmen aus dem Ordner assets — auf dem Weg ins Spiel.

   Die Dateien liegen als Beigaben neben der App. Wo ihr Pfad im Markup steht,
   setzt das Bündeln ihre data:-Quelle ein; die App selbst kann sie nicht laden,
   denn Pfade führen im Fensterrahmen nirgendwohin. Alles hängt also daran, dass
   das Bündeln die Stelle erkennt, an der der Pfad steht.

   Welche Stelle das ist, ist inzwischen erwiesen: das src eines <source> im
   <audio> (index.html). Im gebauten Dokument steht dort eine data:-Quelle. Die
   beiden Ausweichwege von früher — eine Stilregel url(…) und ein verstecktes
   Bildelement — sind damit überflüssig und wieder entfernt; sie hätten jede
   Aufnahme ein zweites und drittes Mal ins Dokument gelegt.

   Diese Datei liest die Quelle ab und reicht sie mit adoptUri() an sound.js
   weiter. Was ein Pfad geblieben ist, wird übergangen.

   Sie läuft beim Laden, noch vor der Suche im Datenordner (soundfiles.js). Was
   hier ankommt, gilt: Die Beigabe ist die Aufnahme, die der Anwender gemeint hat —
   eine ältere Fassung im Datenordner überschreibt sie nicht.

   Was dabei herauskam, gibt report() preis — die Ton-Diagnose (Taste T) zeigt es.
   Trägt der Weg nicht, bleibt alles wie zuvor: Die App sucht im Datenordner
   weiter und klingt notfalls mit ihren eigenen Tönen. */
const TetrisSoundAssets = (function () {
  // Klang -> Dateiname der Beigabe. Nur zum Anzeigen; gefunden wird über die Stelle.
  const FILES = {
    move: "move-and-turn-shorter.wav",
    drop: "drop-sound.mp3",
    rows: "row-completed-sound.mp3",
    tetris: "tetris-sound.mp3"
  };

  const state = {}; // key -> { way, kb, state }
  let note = "noch nicht gelesen";

  // --- Die Stelle ---

  /* Die Quelle steht am <source> im <audio>, nicht am Element selbst — das ist die
     Schreibweise, an der das Bündeln eine Beigabe erkennt. */
  function fromSource(key) {
    const el = document.querySelector("#snd-" + key + " source");
    return el ? (el.getAttribute("src") || "") : "";
  }

  // --- Übernehmen ---

  function kbOf(uri) {
    const comma = uri.indexOf(",");
    return comma < 0 ? 0 : Math.round((uri.length - comma) * 0.75 / 1024 * 10) / 10;
  }

  function takeOne(key) {
    const uri = fromSource(key);
    if (!uri || uri.slice(0, 5) !== "data:") {
      state[key] = { way: "", kb: 0, state: "nicht eingebettet" };
      return false;
    }
    const ok = TetrisSound.adoptUri(key, uri, FILES[key]);
    state[key] = { way: "Quelle im Klang", kb: kbOf(uri),
                   state: ok ? "übernommen" : "abgewiesen" };
    return ok;
  }

  /* Einmal alles durchsehen. Läuft beim Laden von selbst; die Diagnose darf es
     wiederholen. */
  function read() {
    let n = 0;
    for (const key in FILES) if (takeOne(key)) n++;
    note = n === 4 ? "alle vier Aufnahmen übernommen"
      : n ? n + " von 4 Aufnahmen übernommen"
      : "keine Aufnahme eingebettet";
    return report();
  }

  // Nur Ablesen, kein Eingriff — für die Ton-Diagnose.
  function report() {
    return { note: note, files: FILES, found: state };
  }

  /* Gelesen wird, sobald das Dokument steht: Vorher gibt es die Elemente noch
     nicht. */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", read);
  } else {
    read();
  }

  return { read: read, report: report };
})();
</script>
<script>/* Die Aufnahmen aus dem Datenordner.

   Das ist das NETZ, nicht der Regelweg. Im Regelfall liegen die vier Aufnahmen als
   Beigaben im Ordner assets, und das Bündeln setzt sie ins Dokument (soundassets.js).
   Nur wenn das einmal nicht geschieht, steht an ihrer Stelle ein Pfad — und ein
   Pfad führt in diesem Fensterrahmen nirgendwohin: Das Element meldet dann "Quelle
   nicht spielbar (Fehler 4)", und es bliebe bei den eigenen Tönen.

   Dann gibt es genau einen Weg, auf dem die Bytes einer Aufnahme dennoch in die
   laufende App gelangen: das Dateisystem des Workspace (morphosFS). Von dort
   gelesen, werden sie in sound.js entpackt und ersetzen, was im Dokument steht.
   Was der App beiliegt, wird dabei NICHT ersetzt (siehe done()).

   Gesucht wird beim Start, ohne Zutun — in dieser Ordnung:
     1. die Merkliste zuletzt von Hand gewählter Dateien (tetris-sounds.json),
     2. der Ordner tetris-sounds/,
     3. der Datenordner selbst.
   Welcher Klang gemeint ist, verrät der Dateiname.

   Zwei Formen werden gelesen:
     - eine Tondatei (mp3/wav/ogg/m4a), sofern das Dateisystem ihre Bytes
       unversehrt durchreicht;
     - eine Textdatei mit derselben Aufnahme in base64 (auch als data:-Zeile) —
       der Weg, der immer trägt, weil Text unterwegs nichts verliert.

   Dateien, die WOANDERS liegen — etwa im Ordner assets neben der App —, kann die
   App nicht von sich aus lesen: Der Datenordner ist alles, was sie sieht. Herein
   kommen sie über den Anwender, der sie im Dateidialog wählt oder über dem Fenster
   fallen lässt (intake/intakeAs). Was so ankommt, klingt auf der Stelle UND wird
   als base64 in tetris-sounds/ gesichert — die Suche findet es beim nächsten Start
   von selbst.

   Findet sich nichts, bleibt alles, wie es war: Die App klingt mit ihren eigenen
   Tönen weiter. Was gefunden wurde, gibt report() preis; die Ton-Diagnose
   (Taste T) zeigt es und nimmt Dateien entgegen. */
const TetrisSoundFiles = (function () {
  const DIR = "tetris-sounds";
  const LIST = "tetris-sounds.json"; // die Merkliste: Klang -> gesicherte Datei

  // Woran ein Klang in einem Dateinamen zu erkennen ist — ohne Endung, klein
  // geschrieben, ohne Trennzeichen. Erst genau, dann als Teil des Namens.
  const NAMES = {
    move: ["move", "moveandturn", "moveturn", "schieben", "drehen"],
    drop: ["drop", "dropsound", "aufsetzen", "fallen"],
    rows: ["rows", "row", "rowcompleted", "rowcompletedsound", "reihe", "line"],
    tetris: ["tetris", "tetrissound", "viererreihe"]
  };

  const MIME = { mp3: "audio/mpeg", mpeg: "audio/mpeg", wav: "audio/wav",
                 ogg: "audio/ogg", oga: "audio/ogg", m4a: "audio/mp4",
                 aac: "audio/aac", flac: "audio/flac", webm: "audio/webm" };

  /* Nur diese Endungen kommen beim Durchsehen eines Ordners in Frage. Die Grenze
     ist nötig, weil im Datenordner auch die Dateien der App liegen: Ohne sie
     hielte die Merkliste "tetris-sounds.json" sich selbst für den Tetris-Klang. */
  const EXTS = ["mp3", "mpeg", "wav", "ogg", "oga", "m4a", "aac", "flac", "webm",
                "b64", "base64", "txt"];

  const found = {};          // key -> { name, path, how, kb, state }
  let note = "noch nicht gesucht";
  let picks = null;          // die Merkliste, sobald sie gelesen wurde

  // --- Namen ---

  function extOf(name) {
    const dot = name.lastIndexOf(".");
    return dot > 0 ? name.slice(dot + 1).toLowerCase() : "";
  }
  function baseOf(name) {
    const dot = name.lastIndexOf(".");
    return (dot > 0 ? name.slice(0, dot) : name).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function keyOf(name) {
    if (EXTS.indexOf(extOf(name)) < 0) return null;
    const b = baseOf(name);
    if (!b) return null;
    for (const key in NAMES) {
      if (NAMES[key].indexOf(b) >= 0) return key;
    }
    for (const key in NAMES) {
      const list = NAMES[key];
      for (let i = 0; i < list.length; i++) {
        if (b.indexOf(list[i]) >= 0) return key;
      }
    }
    return null;
  }

  // --- Aus Text werden Bytes ---

  function fromBase64(s) {
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  /* Das Dateisystem liefert Text. Steht darin base64 (auch mit data:-Kopf), ist der
     Fall klar. Sonst können es die Bytes selbst sein, Zeichen für Zeichen — aber nur,
     wenn sie den Weg unbeschadet überstanden haben: Ein Zeichen über 255 heißt, dass
     die Datei als Text gelesen wurde und dabei zerfiel — auch das Ersatzzeichen, mit
     dem ein Leser jedes unverständliche Byte quittiert, liegt darüber. */
  function bytesOf(text) {
    if (typeof text !== "string" || !text.length) return { err: "leer" };
    let s = text;
    if (/^\s*data:[^,]{0,200},/.test(s)) s = s.slice(s.indexOf(",") + 1);
    const clean = s.replace(/\s+/g, "");
    if (clean.length > 64 && /^[A-Za-z0-9+/]+={0,2}$/.test(clean)) {
      try { return { buf: fromBase64(clean), how: "base64" }; } catch (e) { /* dann eben nicht */ }
    }
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (c > 255) return { err: "als Text zerfallen" };
      bytes[i] = c;
    }
    return { buf: bytes.buffer, how: "Bytes" };
  }

  /* Woran eine Aufnahme zu erkennen ist, wenn die Endung nichts verrät (base64 in
     einer .txt): an ihren ersten Bytes. Nur das Element braucht diese Auskunft —
     das Entpacken riecht selbst, was es vor sich hat. */
  function sniff(buffer) {
    const n = Math.min(12, buffer.byteLength);
    const b = new Uint8Array(buffer, 0, n);
    const head = String.fromCharCode(b[0] || 0, b[1] || 0, b[2] || 0, b[3] || 0);
    if (head === "RIFF") return "audio/wav";
    if (head === "OggS") return "audio/ogg";
    if (head === "fLaC") return "audio/flac";
    if (head.slice(0, 3) === "ID3") return "audio/mpeg";
    if (b[0] === 0xFF && (b[1] & 0xE0) === 0xE0) return "audio/mpeg";
    if (n >= 8 && b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70) {
      return "audio/mp4";
    }
    return "";
  }

  // Der letzte Teil eines Pfades — die Dialoge dürfen auch Windows-Trenner liefern.
  function nameOf(path) {
    return String(path).split(/[\\/]/).pop();
  }

  // --- Lesen und übergeben ---

  /* Erledigt ist ein Klang auch dann, wenn seine Aufnahme schon anderswoher kommt:
     Die Beigabe aus dem Ordner assets (soundassets.js) ist die, die der Anwender
     gemeint hat — der Datenordner soll sie nicht stillschweigend ersetzen. Seine
     bewusste Wahl im Dateidialog (intakeAs) geht weiterhin vor. */
  function done(key) {
    if (found[key] && found[key].ok) return true;
    return !!(TetrisSound.has && TetrisSound.has(key));
  }

  async function take(key, name, path) {
    const fs = window.morphosFS;
    const f = found[key] = { name: name, path: path, how: "", kb: 0,
                             ok: false, state: "wird gelesen" };
    if (!fs) { f.state = "kein Datenordner"; return false; }
    let text;
    try { text = await fs.readFile(path); }
    catch (e) { f.state = "nicht lesbar"; return false; }
    const r = bytesOf(text);
    if (!r.buf) { f.state = r.err; return false; }
    f.how = r.how;
    f.kb = Math.round(r.buf.byteLength / 1024 * 10) / 10;
    /* Erkennt der Blick auf die ersten Bytes keine Tonform, ist die Datei auf dem
       Weg durch das Dateisystem als Text zerfallen. Versucht wird es trotzdem —
       aber der Vermerk sagt, woran es liegt, wenn nichts klingt. */
    const kind = sniff(r.buf);
    f.ok = TetrisSound.adopt(key, r.buf, kind || MIME[extOf(name)] || "audio/mpeg", name);
    f.state = !f.ok ? "abgewiesen"
      : kind ? "übernommen"
      : "übernommen, aber keine Tonform erkennbar";
    return f.ok;
  }

  async function fromDir(dir) {
    const fs = window.morphosFS;
    let entries;
    try { entries = await fs.list(dir); } catch (e) { return; }
    if (!Array.isArray(entries)) return;
    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];
      if (!e || e.isDir || !e.name) continue;
      const key = keyOf(e.name);
      if (!key || done(key)) continue;
      // Der Pfad wird selbst gebaut wie im Archiv: relativ zum Datenordner.
      await take(key, e.name, dir ? dir + "/" + e.name : e.name);
    }
  }

  async function fromPicks() {
    const fs = window.morphosFS;
    let text;
    try { text = await fs.readFile(LIST); } catch (e) { return; }
    let map;
    try { map = JSON.parse(text); } catch (e) { return; }
    if (!map || typeof map !== "object") return;
    picks = map;
    for (const key in map) {
      if (!NAMES[key] || done(key)) continue;
      const entry = map[key];
      /* Zwei Formen: früher stand hier nur der Pfad, heute steht daneben auch der
         Name der Datei, aus der die gesicherte Fassung entstanden ist. */
      const path = typeof entry === "string" ? entry
        : entry && typeof entry.path === "string" ? entry.path : "";
      if (!path) continue;
      const name = entry && typeof entry.name === "string" ? entry.name : nameOf(path);
      await take(key, name, path);
    }
  }

  // --- Was von außen aufgerufen wird ---

  /* Einmal alles durchsehen. Läuft beim Start von selbst und noch einmal, wenn die
     Diagnose darum bittet. */
  async function scan() {
    const fs = window.morphosFS;
    if (!fs || !fs.list) { note = "kein Datenordner"; return report(); }
    note = "wird gesucht …";
    await fromPicks();
    await fromDir(DIR);
    await fromDir("");
    /* Gezählt wird nur, was HIER gefunden wurde — was der App beiliegt, ist nicht
       das Verdienst des Datenordners. */
    let n = 0;
    let beigelegt = 0;
    for (const key in NAMES) {
      if (found[key] && found[key].ok) n++;
      else if (TetrisSound.has && TetrisSound.has(key)) beigelegt++;
    }
    note = n ? n + " von 4 Aufnahmen aus dem Datenordner"
      : beigelegt ? "nichts nötig — die Aufnahmen liegen der App bei"
      : "keine Aufnahme gefunden";
    return report();
  }

  // --- Aufnahmen von außen hereinholen ---

  /* Die vier Aufnahmen liegen im Ordner assets neben der App. Dorthin reicht der
     Arm der App nicht: Sie sieht nur den Datenordner. Der Anwender aber kann sie
     ihr geben — im Dateidialog des Browsers oder indem er sie über dem Fenster
     fallen lässt. Von dort kommen echte Bytes an, kein Pfad; damit ist der Umweg
     über das Dateisystem gar nicht nötig.

     Gesichert wird trotzdem: Was hereinkommt, wandert als base64 nach
     tetris-sounds/<klang>.txt. Beim nächsten Start findet die Suche es dort von
     selbst wieder — einmal hereingeholt, bleibt es. */

  function readBytes(file) {
    return new Promise(function (resolve) {
      let r;
      try { r = new FileReader(); } catch (e) { resolve(null); return; }
      r.onload = function () { resolve(r.result || null); };
      r.onerror = function () { resolve(null); };
      try { r.readAsArrayBuffer(file); } catch (e) { resolve(null); }
    });
  }

  // Bytes als Zeichen — in Häppchen, sonst sprengt der Aufruf den Stapel.
  function latin1(buffer) {
    const bytes = new Uint8Array(buffer);
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return s;
  }

  /* In den Datenordner sichern. Der Name ist der Klang selbst — er trifft die
     Namenserkennung immer, gleich wie die Datei ursprünglich hieß. Wie sie hieß,
     merkt sich daneben die Merkliste, damit die Diagnose es weiter zeigen kann. */
  async function store(key, name, b64) {
    const fs = window.morphosFS;
    if (!fs || !fs.writeFile) return "";
    const path = DIR + "/" + key + ".txt";
    if (fs.mkdir) { try { await fs.mkdir(DIR); } catch (e) { /* gibt es schon */ } }
    try { await fs.writeFile(path, b64); } catch (e) { return ""; }
    if (!picks) picks = {};
    picks[key] = { path: path, name: name };
    try { await fs.writeFile(LIST, JSON.stringify(picks, null, 1)); } catch (e) {}
    return path;
  }

  /* Eine hereingereichte Datei für einen bestimmten Klang übernehmen. */
  async function intakeAs(key, file) {
    if (!NAMES[key] || !file) return false;
    const name = file.name || "Datei";
    const f = found[key] = { name: name, path: "", how: "", kb: 0,
                             ok: false, state: "wird gelesen" };
    let buffer = await readBytes(file);
    if (!buffer || !buffer.byteLength) { f.state = "nicht lesbar"; return false; }
    let how = "Datei";
    /* Auch eine Textdatei mit base64 darf hereingereicht werden — dann steckt die
       Aufnahme in ihren Zeichen, nicht in ihren Bytes. */
    if (!sniff(buffer)) {
      const r = bytesOf(latin1(buffer));
      if (r.buf && sniff(r.buf)) { buffer = r.buf; how = r.how; }
    }
    let b64;
    // Vor dem Übernehmen: das Entpacken frisst den Puffer auf.
    try { b64 = btoa(latin1(buffer)); } catch (e) { b64 = ""; }
    f.how = how;
    f.kb = Math.round(buffer.byteLength / 1024 * 10) / 10;
    const kind = sniff(buffer) || MIME[extOf(name)] || "audio/mpeg";
    f.ok = TetrisSound.adopt(key, buffer, kind, name);
    if (!f.ok) { f.state = "abgewiesen"; return false; }
    f.path = b64 ? await store(key, name, b64) : "";
    f.state = f.path ? "übernommen und gesichert" : "übernommen (nur diese Sitzung)";
    return true;
  }

  /* Mehrere Dateien auf einmal — welcher Klang gemeint ist, verrät der Name. Das
     ist der Weg für das Fallenlassen und für die Wahl aller vier auf einmal. */
  async function intake(files) {
    const list = files ? Array.prototype.slice.call(files) : [];
    let taken = 0;
    let missed = 0;
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      if (!file || !file.name) continue;
      const key = keyOf(file.name);
      if (!key) { missed++; continue; }
      if (await intakeAs(key, file)) taken++; else missed++;
    }
    note = taken
      ? taken + (taken === 1 ? " Aufnahme übernommen" : " Aufnahmen übernommen")
          + (missed ? ", " + missed + " nicht zugeordnet" : "")
      : list.length
        ? "keine der " + list.length + " Dateien ließ sich zuordnen"
        : "keine Datei dabei";
    return report();
  }

  // Nur Ablesen, kein Eingriff — für die Ton-Diagnose.
  function report() {
    return {
      fs: !!(window.morphosFS && window.morphosFS.list),
      dir: DIR,
      note: note,
      files: found
    };
  }

  // Beim Start einmal von selbst: Was hier liegt, klingt ab dem ersten Zug.
  function begin() { scan().catch(function () { note = "Suche misslungen"; }); }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", begin);
  } else {
    begin();
  }

  return {
    scan: scan,
    intake: intake,
    intakeAs: intakeAs,
    report: report,
    dir: DIR
  };
})();
</script>
<script>/* Die Bildschau des Spielfelds. Ein eigener Bildtakt zeichnet fortlaufend den
   neuesten Spielzustand — mit Nachglühen, Funken, Lichtsäulen und Erschütterung.
   Sie liest den Zustand nur; verändert wird er allein in engine.js.

   Woher sie weiß, was geschehen ist: Was man dem Zustand ansieht (volle Reihen,
   Level, Punkte, Spielende), erkennt sie am Vergleich mit dem letzten Bild — das
   gilt auch für die Wiedergabe. Was man ihm nicht ansieht (Drehung, Fallenlassen,
   Einrasten), meldet die Regel selbst über das Band state.fx. */
const TetrisFx = (function () {
  const COLS = 10, ROWS = 20;
  const MAX_PARTS = 520;
  const TAU = Math.PI * 2;
  const P = TetrisPaint;

  function create(canvas) {
    const ctx = canvas.getContext("2d");
    const bloom = document.createElement("canvas");
    const bctx = bloom.getContext("2d");

    let w = 0, h = 0, cell = 0, ox = 0, oy = 0, dpr = 1, bk = 1;
    let raf = 0, alive = true, last = 0, t = 0;
    let game = null, stars = [];
    let shake = 0, flash = 0, flashHex = "#ffffff";
    let vy = null, vyPiece = null; // die gezeichnete Höhe des Steins und wessen sie ist

    const parts = [], rings = [], beams = [], bars = [], texts = [], trail = [];
    const prev = { word: null, elapsed: null, level: null, score: null,
                   clearKey: "", over: false, mark: null, clearY: 0 };

    // --- Maße ---

    function resize() {
      const rw = canvas.clientWidth, rh = canvas.clientHeight;
      if (!rw || !rh) return;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = rw; h = rh;
      cell = Math.min(w / COLS, h / ROWS);
      ox = (w - cell * COLS) / 2;
      oy = (h - cell * ROWS) / 2;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      bloom.width = Math.max(1, Math.round(w * dpr * 0.34));
      bloom.height = Math.max(1, Math.round(h * dpr * 0.34));
      bk = bloom.width / w;
      stars = [];
      for (let i = 0; i < 70; i++) {
        stars.push({ x: Math.random(), y: Math.random(), s: Math.random() < 0.8 ? 1 : 2,
                     a: 0.15 + Math.random() * 0.5, f: 0.6 + Math.random() * 1.8, p: Math.random() * TAU });
      }
    }

    // --- Was gezeigt werden soll ---

    function spark(x, y, hex, vx, vy, life, size, kind) {
      if (parts.length >= MAX_PARTS) return;
      parts.push({ x: x, y: y, vx: vx, vy: vy, life: life, max: life, hex: hex,
                   size: size, kind: kind || "dot",
                   rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 0.02 });
    }
    function burst(x, y, hex, n, speed, life, size, kind) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * TAU;
        const v = speed * (0.3 + Math.random());
        spark(x, y, hex, Math.cos(a) * v, Math.sin(a) * v, life * (0.6 + Math.random() * 0.7), size, kind);
      }
    }
    function ring(x, y, hex, rMax, life, width) {
      rings.push({ x: x, y: y, hex: hex, rMax: rMax, life: life, max: life, width: width });
    }
    function say(x, y, text, hex, size, life) {
      texts.push({ x: x, y: y, text: text, hex: hex, size: size, life: life, max: life });
    }
    function reset(g) {
      parts.length = 0; rings.length = 0; beams.length = 0;
      bars.length = 0; texts.length = 0; trail.length = 0;
      shake = 0; flash = 0;
      prev.level = g ? g.level : null;
      prev.score = g ? g.score : null;
      prev.clearKey = g && g.clearRows ? g.clearRows.join(",") : "";
      prev.over = g ? g.over : false;
      prev.mark = null;
      vy = null; vyPiece = null;
    }

    /* Wie weit der Stein zwischen zwei Feldern schon unterwegs ist — 0 bis 1.
       Voll bis 1 gezählt: 1 ist genau das nächste Feld, deshalb geht die Bewegung
       ohne Sprung in den nächsten Schritt der Regel über. */
    function pieceFrac(g) {
      if (!g.piece || g.over || g.paused || g.clearRows) return 0;
      if (TetrisEngine.dropDistance(g) <= 0) return 0;
      const iv = TetrisPieces.gravityMs(g.level);
      if (!(iv > 0)) return 0;
      return Math.max(0, Math.min(1, g.dropTimer / iv));
    }

    /* Die Meldungen der Regel: Schieben, Drehung, Fallenlassen, Einrasten.
       Nur zu sehen: Die Klänge dazu hängen in der Regel selbst am Zug, weil sie
       hier ein Bild zu spät kämen. Das Schieben hat gar kein Bild. */
    function handle(ev) {
      if (ev.k === "move") return; // das Schieben hört man nur; zu sehen ist es nicht
      // Der Ton zum Zug klingt schon in der Regel (engine.js), nicht erst hier.

      const hex = P.typeColor(ev.type);
      const cells = TetrisPieces.SHAPES[ev.type] ? TetrisPieces.SHAPES[ev.type][ev.rot] : null;
      if (!cells) return;
      if (ev.k === "rot") {
        let sx = 0, sy = 0;
        for (let i = 0; i < cells.length; i++) { sx += ev.x + cells[i][0] + 0.5; sy += ev.y + cells[i][1] + 0.5; }
        ring(sx / cells.length * cell, sy / cells.length * cell, hex, cell * 1.6, 280, cell * 0.1);
        return;
      }
      if (ev.k === "drop") {
        // Über jede Spalte des Steins eine Lichtsäule, vom Absprung bis zum Aufschlag.
        const deep = {};
        for (let i = 0; i < cells.length; i++) {
          const c = ev.x + cells[i][0];
          if (deep[c] === undefined || cells[i][1] > deep[c]) deep[c] = cells[i][1];
        }
        for (const key in deep) {
          const c = Number(key);
          beams.push({ x: c * cell, w: cell, hex: hex, life: 340, max: 340,
                       y0: (ev.from + deep[key]) * cell, y1: (ev.to + deep[key] + 1) * cell });
          burst((c + 0.5) * cell, (ev.to + deep[key] + 1) * cell, hex,
                4, cell * 0.006, 420, cell * 0.12, "dot");
        }
        shake = Math.min(16, shake + 2.5 + ev.dist * 0.5);
        return;
      }
      if (ev.k === "lock") {
        for (let i = 0; i < cells.length; i++) {
          const x = (ev.x + cells[i][0] + 0.5) * cell;
          const y = (ev.y + cells[i][1] + 1) * cell;
          burst(x, y, hex, 3, cell * 0.004, 380, cell * 0.1, "dot");
        }
        shake = Math.min(12, shake + 1.8);
      }
    }

    /* Volle Reihen: gleißender Balken, Splitter in den Farben der Steine, eine
       Druckwelle und ein Aufblitzen, das mit der Zahl der Reihen wächst. */
    function clearBurst(g, rows) {
      const n = rows.length;
      /* Vier Reihen haben ihren eigenen Klang, ein einziger Anschlag. Zwei und
         drei bekommen je Reihe einen — kurz gestaffelt, damit man sie zählen
         hört, statt sie zu einem Ton zu verschmelzen. In der musikalischen
         Partie bleibt auch das still: Dort klingen allein die Akkorde. */
      if (g.musical) { /* still */ }
      else if (n >= 4) TetrisSound.play("tetris");
      else if (n > 1) TetrisSound.series("rows", n, 110);
      else TetrisSound.play("rows");
      for (let i = 0; i < n; i++) {
        const r = rows[i];
        bars.push({ row: r, life: 420, max: 420 });
        for (let c = 0; c < COLS; c++) {
          const hex = P.typeColor(g.board[r][c]);
          burst((c + 0.5) * cell, (r + 0.5) * cell, hex,
                n >= 4 ? 5 : 3, cell * 0.009, 620, cell * 0.14,
                Math.random() < 0.45 ? "shard" : "dot");
        }
        ring(COLS * cell / 2, (r + 0.5) * cell, "#ffffff", cell * 8, 460, cell * 0.14);
      }
      prev.clearY = (rows[0] + 0.5) * cell;
      shake = Math.min(28, shake + 5 + n * 4);
      flash = Math.min(1, flash + 0.15 * n);
      flashHex = n >= 4 ? P.levelColor(g.level) : "#ffffff";
      if (n >= 4) say(COLS * cell / 2, prev.clearY, "TETRIS", "#ffffff", cell * 1.1, 1200);
      else if (n === 3) say(COLS * cell / 2, prev.clearY, "DREIFACH", "#ffe040", cell * 0.7, 900);
    }

    function levelUp(g) {
      const hex = P.levelColor(g.level);
      flash = Math.max(flash, 0.32);
      flashHex = hex;
      ring(COLS * cell / 2, ROWS * cell / 2, hex, cell * 12, 850, cell * 0.32);
      burst(COLS * cell / 2, ROWS * cell / 2, hex, 30, cell * 0.009, 1000, cell * 0.18, "dot");
      say(COLS * cell / 2, ROWS * cell * 0.3, "LEVEL " + g.level, hex, cell * 0.8, 1400);
    }

    function gameOver(g) {
      flash = 0.7; flashHex = "#ff5c78";
      shake = 24;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!g.board[r][c] || Math.random() > 0.5) continue;
          spark((c + 0.5) * cell, (r + 0.5) * cell, P.typeColor(g.board[r][c]),
                (Math.random() - 0.5) * cell * 0.006, -Math.random() * cell * 0.005,
                800 + Math.random() * 700, cell * 0.16, "shard");
        }
      }
    }

    // --- Fortschreiben ---

    function watch(g) {
      const key = g.clearRows ? g.clearRows.join(",") : "";
      if (key && key !== prev.clearKey) clearBurst(g, g.clearRows);
      prev.clearKey = key;

      if (prev.level !== null && g.level > prev.level) levelUp(g);
      prev.level = g.level;

      if (prev.score !== null && g.score - prev.score >= 40) {
        say(COLS * cell / 2, prev.clearY || ROWS * cell * 0.45, "+" + (g.score - prev.score),
            P.levelColor(g.level), cell * 0.62, 950);
      }
      prev.score = g.score;

      if (g.over && !prev.over) gameOver(g);
      prev.over = g.over;
    }

    function step(dt) {
      t += dt;
      const g = game;
      if (g) {
        // Ein neues Spiel — oder ein Sprung zurück in der Aufzeichnung — räumt auf.
        if (prev.word !== g.seedWord || prev.elapsed === null || g.elapsed < prev.elapsed - 1) reset(g);
        prev.word = g.seedWord;
        prev.elapsed = g.elapsed;
        if (g.fx && g.fx.length) {
          for (let i = 0; i < g.fx.length; i++) handle(g.fx[i]);
          g.fx.length = 0;
        }
        watch(g);

        /* Die gezeichnete Höhe des Steins zieht der Regel weich nach. Zwischen zwei
           Feldern gleitet sie ohnehin mit; das Nachziehen glättet zusätzlich die
           Sprünge, die die Regel selbst macht — vor allem beim Halten von "ein Feld
           tiefer", wo der Stein sonst im Raster hüpft. Ein neuer Stein oder ein
           weiter Sprung setzt sie sofort, damit nichts hinterherschleift. */
        if (g.piece && !g.over) {
          const target = g.piece.y + pieceFrac(g);
          if (vy === null || vyPiece !== g.piece || g.paused || Math.abs(target - vy) > 2.5) {
            vy = target;
          } else {
            vy += (target - vy) * (1 - Math.pow(0.004, dt / 90));
            if (Math.abs(target - vy) < 0.004) vy = target;
          }
          vyPiece = g.piece;
        } else { vy = null; vyPiece = null; }

        // Das Nachglühen: abgetastet wird die gleitende Lage, nicht das Feldraster.
        if (g.piece && !g.over && !g.paused) {
          const p = g.piece;
          const m = prev.mark;
          if (!m || m.type !== p.type || m.rot !== p.rot || m.x !== p.x ||
              Math.abs(vy - m.y) >= 0.26) {
            prev.mark = { type: p.type, rot: p.rot, x: p.x, y: vy };
            trail.push({ type: p.type, rot: p.rot, x: p.x, y: vy, life: 190, max: 190 });
            if (trail.length > 12) trail.shift();
          }
        } else prev.mark = null;
      }

      const grav = cell * 0.00001;
      for (let i = parts.length - 1; i >= 0; i--) {
        const q = parts[i];
        q.life -= dt;
        if (q.life <= 0) { parts.splice(i, 1); continue; }
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.vy += grav * dt;
        q.vx *= 0.995;
        q.rot += q.vr * dt;
      }
      decay(rings, dt); decay(beams, dt); decay(bars, dt); decay(texts, dt); decay(trail, dt);

      const k = dt / 16.7;
      shake *= Math.pow(0.86, k);
      flash *= Math.pow(0.85, k);
      if (shake < 0.15) shake = 0;
      if (flash < 0.004) flash = 0;
    }

    function decay(list, dt) {
      for (let i = list.length - 1; i >= 0; i--) {
        list[i].life -= dt;
        if (list[i].life <= 0) list.splice(i, 1);
      }
    }

    // --- Zeichnen ---

    /* Die Szene wird zweimal gezeichnet: einmal fein auf das sichtbare Bild und
       einmal grob auf eine kleine Fläche, die danach weich und additiv darüber
       kommt — daher das Glühen. */
    function scene(c, hi) {
      const g = game;
      c.save();
      c.translate(ox, oy);
      if (g) {
        drawBoard(c, g, hi);
        drawBars(c);
        drawTrail(c);
        drawGhost(c, g, hi);
        drawPiece(c, g, hi);
      }
      drawBeams(c);
      drawRings(c);
      drawParts(c);
      if (hi) drawTexts(c);
      c.restore();
    }

    function drawBoard(c, g, hi) {
      const dim = g.over ? 0.5 : 1;
      for (let r = 0; r < ROWS; r++) {
        const hot = g.clearRows && g.clearRows.indexOf(r) !== -1;
        for (let cc = 0; cc < COLS; cc++) {
          const type = g.board[r][cc];
          if (!type) continue;
          const hex = hot ? "#ffffff" : P.typeColor(type);
          const x = cc * cell, y = r * cell;
          if (hi) P.block(c, x, y, cell, hex, dim, hot ? 0.8 : 0);
          else {
            c.fillStyle = P.col(hex, hot ? 0.95 : 0.4 * dim);
            c.fillRect(x, y, cell, cell);
          }
        }
      }
    }

    function drawGhost(c, g, hi) {
      if (!g.piece || g.over) return;
      const d = TetrisEngine.dropDistance(g);
      if (d <= 0) return;
      const p = g.piece;
      const cells = TetrisPieces.SHAPES[p.type][p.rot];
      const hex = P.typeColor(p.type);
      const a = 0.5 + 0.2 * Math.sin(t / 260);
      for (let i = 0; i < cells.length; i++) {
        const y = p.y + cells[i][1] + d;
        if (y < 0) continue;
        const x = (p.x + cells[i][0]) * cell;
        if (hi) P.ghost(c, x, y * cell, cell, hex, a);
        else { c.fillStyle = P.col(hex, 0.1); c.fillRect(x, y * cell, cell, cell); }
      }
    }

    /* Gezeichnet wird die nachgezogene Höhe vy, nicht die des Spielstands: Der Stein
       gleitet zwischen zwei Feldern weiter — die volle Feldbreite, denn erst dann
       geht der letzte Bildpunkt nahtlos in den nächsten Schritt der Regel über. */
    function drawPiece(c, g, hi) {
      if (!g.piece || g.over) return;
      const p = g.piece;
      const cells = TetrisPieces.SHAPES[p.type][p.rot];
      const hex = P.typeColor(p.type);
      const py = vy === null ? p.y : vy;
      const glow = 0.5 + 0.25 * Math.sin(t / 190);
      for (let i = 0; i < cells.length; i++) {
        const y = py + cells[i][1];
        if (y < -1) continue;
        const x = (p.x + cells[i][0]) * cell;
        if (hi) P.block(c, x, y * cell, cell, hex, 1, glow);
        else { c.fillStyle = P.col(hex, 0.8); c.fillRect(x, y * cell, cell, cell); }
      }
    }

    function drawTrail(c) {
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < trail.length; i++) {
        const q = trail[i];
        const k = q.life / q.max;
        const a = 0.22 * k * k;
        if (a < 0.008) continue;
        const cells = TetrisPieces.SHAPES[q.type][q.rot];
        c.fillStyle = P.col(P.typeColor(q.type), a);
        for (let j = 0; j < cells.length; j++) {
          const b = P.tileBox((q.x + cells[j][0]) * cell, (q.y + cells[j][1]) * cell,
                              cell, cell * P.PAD);
          P.roundRect(c, b[0], b[1], b[2] - b[0], b[3] - b[1], cell * P.RAD);
          c.fill();
        }
      }
      c.restore();
    }

    function drawBars(c) {
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < bars.length; i++) {
        const b = bars[i];
        const k = b.life / b.max;
        const y = b.row * cell;
        const grow = (1 - k) * cell * 1.4;
        const g = c.createLinearGradient(0, y - grow, 0, y + cell + grow);
        g.addColorStop(0, "rgba(255,255,255,0)");
        g.addColorStop(0.5, "rgba(255,255,255," + (0.85 * k).toFixed(3) + ")");
        g.addColorStop(1, "rgba(255,255,255,0)");
        c.fillStyle = g;
        c.fillRect(-cell, y - grow, cell * (COLS + 2), cell + grow * 2);
      }
      c.restore();
    }

    function drawBeams(c) {
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < beams.length; i++) {
        const b = beams[i];
        const k = b.life / b.max;
        const g = c.createLinearGradient(0, b.y0, 0, b.y1);
        g.addColorStop(0, P.col(b.hex, 0));
        g.addColorStop(1, P.col(b.hex, 0.7 * k));
        c.fillStyle = g;
        const inset = (1 - k) * b.w * 0.34;
        c.fillRect(b.x + inset, b.y0, b.w - inset * 2, Math.max(0, b.y1 - b.y0));
      }
      c.restore();
    }

    function drawRings(c) {
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < rings.length; i++) {
        const r = rings[i];
        const k = 1 - r.life / r.max;
        const rad = r.rMax * (1 - (1 - k) * (1 - k));
        if (rad <= 0) continue;
        c.strokeStyle = P.col(r.hex, 0.65 * (1 - k));
        c.lineWidth = Math.max(1, r.width * (1 - k));
        c.beginPath();
        c.arc(r.x, r.y, rad, 0, TAU);
        c.stroke();
      }
      c.restore();
    }

    function drawParts(c) {
      c.save();
      c.globalCompositeOperation = "lighter";
      for (let i = 0; i < parts.length; i++) {
        const q = parts[i];
        const k = q.life / q.max;
        const a = Math.min(1, k * 1.7);
        if (q.kind === "shard") {
          c.save();
          c.translate(q.x, q.y);
          c.rotate(q.rot);
          c.fillStyle = P.col(q.hex, a);
          c.fillRect(-q.size / 2, -q.size / 2, q.size, q.size * 0.7);
          c.restore();
        } else {
          const s = q.size * (0.5 + k);
          c.globalAlpha = a;
          c.drawImage(P.dot(q.hex), q.x - s, q.y - s, s * 2, s * 2);
          c.globalAlpha = 1;
        }
      }
      c.restore();
    }

    function drawTexts(c) {
      for (let i = 0; i < texts.length; i++) {
        const q = texts[i];
        const k = q.life / q.max;
        const grow = Math.min(1, (1 - k) * 6);
        c.save();
        c.globalAlpha = Math.min(1, k * 2.4);
        c.translate(q.x, q.y - (1 - k) * cell * 1.6);
        c.scale(0.6 + 0.4 * grow, 0.6 + 0.4 * grow);
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.font = "800 " + q.size.toFixed(1) + "px 'Segoe UI', system-ui, sans-serif";
        c.lineWidth = Math.max(2, q.size * 0.16);
        c.strokeStyle = "rgba(0,0,0,.6)";
        c.strokeText(q.text, 0, 0);
        c.shadowColor = q.hex;
        c.shadowBlur = q.size * 0.8;
        c.fillStyle = "#ffffff";
        c.fillText(q.text, 0, 0);
        c.fillStyle = q.hex;
        c.globalAlpha *= 0.55;
        c.fillText(q.text, 0, 0);
        c.restore();
      }
    }

    function draw() {
      const g = game;
      const hex = g ? P.levelColor(g.level) : "#6ea8ff";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      P.backdrop(ctx, w, h, cell, t, hex, stars);

      const sx = shake ? (Math.random() * 2 - 1) * shake : 0;
      const sy = shake ? (Math.random() * 2 - 1) * shake : 0;
      ctx.translate(sx, sy);
      bctx.setTransform(bk, 0, 0, bk, sx * bk, sy * bk);
      bctx.clearRect(-sx, -sy, w, h);

      scene(ctx, true);
      scene(bctx, false);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.75;
      ctx.filter = "blur(" + Math.max(2, cell * 0.28).toFixed(1) + "px)";
      ctx.drawImage(bloom, 0, 0, w, h);
      ctx.restore();

      if (flash > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = P.col(flashHex, Math.min(0.8, flash));
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      const over = !!(g && g.over);
      P.vignette(ctx, w, h, over ? "#ff5c78" : hex, over ? 0.6 : 0.32);
    }

    // --- Bildtakt ---

    function frame(now) {
      if (!alive) return;
      if (canvas.clientWidth !== w || canvas.clientHeight !== h) resize();
      const dt = last ? Math.min(now - last, 50) : 16;
      last = now;
      if (w > 0 && h > 0) { step(dt); draw(); }
      raf = requestAnimationFrame(frame);
    }

    resize();
    raf = requestAnimationFrame(frame);

    return {
      setGame: function (g) { game = g; },
      destroy: function () { alive = false; cancelAnimationFrame(raf); }
    };
  }

  return { create: create };
})();
</script>
<script>/* Die Ansichten des Spiels: Feld, Vorschau, Statistik und der Startbildschirm.
   Sie zeigen nur an, was man ihnen gibt — gesteuert wird in app.js. */

/* Das Feld ist eine Leinwand: Preact hängt sie nur auf und reicht ihr den
   jeweils neuesten Spielzustand; gezeichnet wird in fx.js mit eigenem Bildtakt. */
function Board({ game }) {
  const { useRef, useEffect } = preactHooks;
  const nodeRef = useRef(null);
  const fxRef = useRef(null);

  useEffect(() => {
    const fx = TetrisFx.create(nodeRef.current);
    fxRef.current = fx;
    fx.setGame(game);
    return () => { fx.destroy(); fxRef.current = null; };
  }, []);

  // Nach jedem Neuzeichnen bekommt die Leinwand den aktuellen Stand gereicht.
  useEffect(() => { if (fxRef.current) fxRef.current.setGame(game); });

  return html`<canvas class="board" ref=${nodeRef}></canvas>`;
}

function Preview({ type }) {
  const n = TetrisPieces.SIZE[type];
  const cells = TetrisPieces.SHAPES[type][0];
  const filled = new Set(cells.map((p) => p[1] * n + p[0]));
  const grid = [];
  for (let i = 0; i < n * n; i++) {
    grid.push(html`<div key=${i} class=${filled.has(i) ? "cell c-" + type : "cell empty"}></div>`);
  }
  return html`<div class="preview" style=${"grid-template-columns: repeat(" + n + ", var(--mini))"}>${grid}</div>`;
}

/* Die Kopfkarte der rechten Spalte: klassisch zählen die Punkte, im Endlosspiel
   die durchgehaltene Zeit — sie ist dort das Ergebnis. */
function ScoreBox({ game }) {
  if (game.mode === TetrisEngine.FOREVER) {
    return html`<div class="box">
      <h2>Zeit</h2>
      <p class="big">${TetrisScores.formatDuration(game.elapsed)}</p>
      <p class="mode-line">${game.score} Punkte</p>
    </div>`;
  }
  return html`<div class="box">
    <h2>Punkte</h2><p class="big">${game.score}</p>
  </div>`;
}

/* Das Klangbett in Worten: welche Stufe der Tonart gerade steht und welche mit
   dem nächsten Stein kommt. Nur das musikalische Endlosspiel zeigt sie. */
function ChordBox({ game }) {
  /* Zwischen zwei Steinen — während die vollen Reihen fallen — gibt es keinen
     Stein, wohl aber einen Akkord: den, der noch steht. */
  const next = TetrisPad.chordOf(game.nextType);
  const cur = TetrisPad.chordOf(game.piece ? game.piece.type : TetrisPad.playing()) || next;
  if (!cur) return null;
  return html`<div class="box">
    <h2>Akkord</h2>
    <p class="big degree">${cur.deg}</p>
    <p class="mode-line">${cur.name} · ${TetrisPad.keyName()}</p>
    ${next && html`<p class="mode-line">dann ${next.deg} · ${next.name}</p>`}
  </div>`;
}

function Stats({ stats }) {
  return html`<div class="stats">
    ${TetrisPieces.TYPES.map((t) => html`
      <div class="stat" key=${t}>
        <span class=${"chip c-" + t}></span><span class="stat-name">${t}</span>
        <span class="stat-count">${stats[t]}</span>
      </div>`)}
  </div>`;
}

/* Die Ansicht der laufenden Partie: das Feld mit seinen Einblendungen, links die
   Statistik, rechts Zahlen, Vorschau, Merkwort und Tastenhilfe. Wo diese Partie
   unter den bisherigen desselben Merkworts steht, rechnet app.js aus. */
function GameScreen({ game, summary, isRecord, rank, canReplay, onRestart, onReplay, onScores }) {
  const g = game;
  return html`<div class=${"app lv" + (g.level % 10)}>
    <aside class="panel left">
      <h2>Statistik</h2>
      <${Stats} stats=${g.stats} />
    </aside>

    <div class="stage">
      <${Board} game=${g} />
      ${g.paused && html`<div class="overlay small">
        <h1>Pause</h1>
        <p class="hint">P zum Weiterspielen</p>
        <button class="start small" disabled=${!canReplay}
          onClick=${onReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${onScores}>Bestenliste</button>
        <p class="hint">Taste R · Taste H</p></div>`}
      ${g.over && html`<div class="overlay small">
        <h1>Game Over</h1>
        <p class="lead">${g.score} Punkte, ${g.lines} Reihen</p>
        ${isRecord && summary.plays > 1 && html`<p class="record">Neuer Bestwert für dieses Wort!</p>`}
        ${rank > 1 && html`<p class="hint">
          Platz ${rank} von ${summary.plays} · Bestwert ${summary.best.score}</p>`}
        <p class="hint seed-hint">Merkwort <b class="seed-word">${g.seedWord}</b></p>
        <button class="start" onClick=${onRestart}>Noch einmal</button>
        <button class="start small" disabled=${!canReplay}
          onClick=${onReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${onScores}>Bestenliste</button>
        <p class="hint">Enter dieselbe Folge · R Aufzeichnung · H Bestenliste · Esc zurück mit neuem Wort</p></div>`}
    </div>

    <aside class="panel right">
      <div class="box">
        <h2>Punkte</h2><p class="big">${g.score}</p>
      </div>
      <div class="box row">
        <div><h2>Level</h2><p class="big">${g.level}</p></div>
        <div><h2>Reihen</h2><p class="big">${g.lines}</p></div>
      </div>
      <div class="box">
        <h2>Nächster</h2>
        <${Preview} type=${g.nextType} />
      </div>
      <div class="box">
        <h2>Merkwort</h2>
        <p class="seed-word">${g.seedWord}</p>
      </div>
      <div class="box keys">
        <h2>Tasten</h2>
        <p><kbd>←</kbd><kbd>→</kbd> verschieben</p>
        <p><kbd>A</kbd><kbd>D</kbd> drehen</p>
        <p><kbd>↓</kbd> ein Feld tiefer</p>
        <p><kbd>Leer</kbd> fallen lassen</p>
        <p><kbd>P</kbd> Pause · <kbd>Esc</kbd> Ende</p>
        <p><kbd>R</kbd> Aufzeichnung (in Pause)</p>
        <p><kbd>H</kbd> Bestenliste (in Pause)</p>
      </div>
    </aside>
  </div>`;
}

// Der Schriftzug zerfällt in Buchstaben, damit jeder für sich leuchten kann.
const TITLE_LETTERS = ["T", "E", "T", "R", "I", "S"];

function StartScreen({ level, onLevel, mode, onMode, musical, onMusical, seed, onSeed,
                       summary, onScores, muted, onSound, onStart }) {
  const levels = [];
  for (let i = 0; i <= 9; i++) levels.push(i);
  const forever = mode === TetrisEngine.FOREVER;
  return html`<div class="overlay">
    <h1 class="title">${TITLE_LETTERS.map((ch, i) => html`
      <span class="tl" key=${i} style=${"--i:" + i}>${ch}</span>`)}</h1>
    <p class="lead">${forever
      ? "Endlos: Das Level bleibt, wo es beginnt. Es zählt, wie lange du durchhältst."
      : "Steine ziehen wie im Original — mit dem Zufallsverfahren des NES."}</p>
    <p class="label">Spielart</p>
    <div class="modes">
      <button class=${"lvl" + (forever ? "" : " on")}
        onClick=${() => onMode(TetrisEngine.CLASSIC)}>Klassisch</button>
      <button class=${"lvl" + (forever ? " on" : "")}
        onClick=${() => onMode(TetrisEngine.FOREVER)}>∞ Endlos</button>
    </div>
    ${forever && html`<div class="modes one">
      <button class=${"lvl" + (musical ? " on" : "")} onClick=${onMusical}>
        ${musical ? "♫ Musik an" : "♫ Musik aus"}</button>
    </div>`}
    ${forever && musical && html`<p class="hint tight">Jeder Stein ist eine Stufe
      in ${TetrisPad.keyName()} — sein Akkord klingt, sobald er erscheint.
      Die Spielgeräusche schweigen dann.</p>`}
    <p class="label">${forever ? "Festes Level" : "Startlevel"}</p>
    <div class="levels">
      ${levels.map((i) => html`
        <button key=${i} class=${"lvl" + (i === level ? " on" : "")}
          onClick=${() => onLevel(i)}>${i}</button>`)}
    </div>
    <p class="label">Merkwort</p>
    <div class="seed-row">
      <input class="seed-input" type="text" value=${seed} spellcheck="false"
        maxLength=${TetrisSeed.MAX_LEN} placeholder="Wort eingeben"
        onInput=${(e) => onSeed(TetrisSeed.sanitizeInput(e.target.value))} />
      <button class="dice" title="Neues Wort würfeln"
        onClick=${() => onSeed(TetrisSeed.randomWord())}>🎲</button>
    </div>
    ${forever
      ? (summary
          ? html`<p class="hint seed-hint">Bestzeit auf Level ${level}
              <b>${TetrisScores.formatDuration(summary.best.duration)}</b> aus
              ${summary.plays === 1 ? "1 Partie" : summary.plays + " Partien"}</p>`
          : html`<p class="hint seed-hint">Level ${level} — noch keine Partie durchgehalten.</p>`)
      : (summary
          ? html`<p class="hint seed-hint">Bestwert <b>${summary.best.score}</b> aus
              ${summary.plays === 1 ? "1 Partie" : summary.plays + " Partien"}</p>`
          : html`<p class="hint seed-hint">Dasselbe Wort spielt dieselbe Steinfolge.</p>`)}
    <button class="start" onClick=${onStart}>Spiel starten</button>
    <div class="start-row">
      <button class="start small" onClick=${onScores}>Bestenliste</button>
      <button class="start small" onClick=${onSound}>${muted ? "🔇 Ton aus" : "🔊 Ton an"}</button>
    </div>
    <p class="hint">Enter startet · M wechselt die Spielart${forever ? " · K die Musik" : ""}
      · H zeigt die Bestenliste · S schaltet den Ton · T prüft ihn</p>
  </div>`;
}
</script>
<script>/* Die Auswertung einer aufgezeichneten Partie: die Zahlen hinter dem Ergebnis und
   zwei Kurven über die Spielzeit. Sie holt sich das Band selbst aus dem Archiv —
   erst dann, wenn der Anwender die Auswertung wirklich aufklappt. */

// Eine Kurve in einem festen Koordinatenfeld von 100 × 40; die Karte streckt es.
function CurveChart({ xs, series }) {
  const H = 40;
  return html`<svg class="chart-svg" viewBox="0 0 100 40" preserveAspectRatio="none">
    ${series.map((s) => {
      const max = Math.max(1, s.max);
      const pts = s.values
        .map((v, i) => xs[i].toFixed(2) + "," + (H - (v / max) * H).toFixed(2))
        .join(" ");
      return s.fill
        ? html`<polygon key=${s.key} class=${"cv cv-" + s.key} points=${"0,40 " + pts + " 100,40"} />`
        : html`<polyline key=${s.key} class=${"cv cv-" + s.key} points=${pts} />`;
    })}
  </svg>`;
}

function Chart({ title, xs, series }) {
  return html`<div class="chart">
    <div class="chart-head">
      <span class="chart-title">${title}</span>
      ${series.map((s) => html`
        <span key=${s.key} class=${"lg lg-" + s.key}>${s.label} <b>${s.top}</b></span>`)}
    </div>
    <${CurveChart} xs=${xs} series=${series} />
  </div>`;
}

// Ein Kasten mit vier Zahlen — die Auswertung besteht aus mehreren davon.
function FactBox({ title, rows }) {
  return html`<div class="fact-box">
    <h3>${title}</h3>
    ${rows.map((r) => html`<p key=${r[0]}><span>${r[0]}</span><b>${r[1]}</b></p>`)}
  </div>`;
}

function AnalysisBody({ a }) {
  const d = TetrisAnalysis.decimal;
  const dur = Math.max(1, a.duration);
  const xs = a.curve.map((p) => (p.t / dur) * 100);

  return html`<div class="analysis">
    <div class="fact-grid">
      <${FactBox} title="Tempo" rows=${[
        ["Punkte je Minute", Math.round(a.ppm)],
        ["Steine je Minute", d(a.spm)],
        ["Sekunden je Stein", d(a.secPerPiece, 2)],
        ["Reihen je Minute", d(a.lpm)]
      ]} />
      <${FactBox} title="Ausbeute" rows=${[
        ["Steine gesetzt", a.pieces],
        ["Reihen je Stein", d(a.efficiency, 2)],
        ["Anteil Tetris", Math.round(a.tetrisRate * 100) + " %"],
        ["längste Strecke ohne I", a.droughtI + " Steine"]
      ]} />
      <${FactBox} title="Stapel" rows=${[
        ["höchster Stand", a.maxHeight + " Reihen"],
        ["Stand am Ende", a.endHeight + " Reihen"],
        ["meiste Löcher", a.maxHoles],
        ["Löcher am Ende", a.endHoles]
      ]} />
      <${FactBox} title="Züge" rows=${[
        ["Drehungen", a.rotations],
        ["Verschiebungen", a.shifts],
        ["Züge je Stein", d(a.movesPerPiece)],
        ["Bilder im Band", a.frames]
      ]} />
    </div>

    <${Chart} title="Punkte und Reihen" xs=${xs} series=${[
      { key: "score", label: "Punkte", top: a.score, fill: true,
        max: Math.max(1, a.score), values: a.curve.map((p) => p.score) },
      { key: "lines", label: "Reihen", top: a.lines,
        max: Math.max(1, a.lines), values: a.curve.map((p) => p.lines) }
    ]} />

    <${Chart} title="Stapel über die Zeit" xs=${xs} series=${[
      { key: "height", label: "Höhe", top: a.maxHeight, fill: true,
        max: TetrisEngine.ROWS, values: a.curve.map((p) => p.height) },
      { key: "holes", label: "Löcher", top: a.maxHoles,
        max: Math.max(1, a.maxHoles), values: a.curve.map((p) => p.holes) }
    ]} />

    <p class="hint tight">
      Die Kurven laufen über die gespielte Zeit, von 0 bis ${TetrisReplay.formatTime(a.duration)}.
    </p>
  </div>`;
}

/* Die Hülle: lädt das Band, wertet es aus und sagt es, wenn beides nicht geht. */
function PlayAnalysis({ file }) {
  const { useState, useEffect } = preactHooks;
  const [view, setView] = useState({ state: "load" });

  useEffect(() => {
    let alive = true;
    setView({ state: "load" });
    TetrisArchive.load(file).then((frames) => {
      if (!alive) return;
      const a = frames ? TetrisAnalysis.analyze(frames) : null;
      setView(a ? { state: "ok", a: a } : { state: "fail" });
    });
    return () => { alive = false; };
  }, [file]);

  if (view.state === "load") return html`<p class="hint tight">Aufzeichnung wird gelesen …</p>`;
  if (view.state === "fail") return html`<p class="hint warn">Die Aufzeichnung ließ sich nicht lesen.</p>`;
  return html`<${AnalysisBody} a=${view.a} />`;
}
</script>
<script>/* Die Ansicht der Bestenliste. Sie hat zwei Register, denn die beiden Spielarten
   messen Verschiedenes: Klassisch gehört die Liste dem Merkwort und zählt die
   Punkte; endlos gehört sie dem festen Level und zählt die durchgehaltene Zeit.
   Links jede Zeile mit ihrem besten Wert, rechts alle Partien dazu im Einzelnen. */
const CLEAR_LABELS = ["Einfach", "Doppel", "Dreifach", "Tetris"];

function PlayCard({ entry, rank, metric }) {
  const when = TetrisScores.formatDate(entry.date);
  const time = metric === "time"; // im Endlosspiel steht die Zeit obenan
  return html`<div class=${"play" + (rank === 1 ? " top" : "")}>
    <div class="play-head">
      <span class="rank">${rank}.</span>
      <span class="play-score">
        ${time ? TetrisScores.formatDuration(entry.duration) : entry.score}</span>
      <span class="play-date">${when || "ohne Zeitpunkt"}</span>
    </div>
    <div class="facts">
      ${time
        ? html`
            <span><b>${entry.score}</b> Punkte</span>
            <span><b>${entry.lines}</b> Reihen</span>
            <span>Level <b>${entry.level}</b></span>
            <span>Wort <b>${entry.seed}</b></span>`
        : html`
            <span><b>${entry.lines}</b> Reihen</span>
            <span>Level <b>${entry.level}</b> · Start ${entry.startLevel}</span>
            <span>Dauer <b>${TetrisScores.formatDuration(entry.duration)}</b></span>`}
    </div>
    <div class="facts clears">
      ${CLEAR_LABELS.map((label, i) => html`
        <span key=${label}>${label} <b>${entry.clears[i]}</b></span>`)}
    </div>
    <div class="play-pieces">
      ${TetrisPieces.TYPES.map((t) => html`
        <span class="pc" key=${t}><span class=${"chip c-" + t}></span>${entry.pieces[t]}</span>`)}
    </div>
    ${entry.resumed ? html`<p class="resumed">↻ mit Wiedereinstieg gespielt</p>` : null}
  </div>`;
}

function ScoresScreen({ store, seed, nextSeed, level, mode, startLevel, running,
                        onPlay, onPlayLevel, onClose }) {
  const { useState, useEffect } = preactHooks;
  // Offen ist zunächst das Register der Spielart, aus der man kommt.
  const [tab, setTab] = useState(mode === TetrisEngine.FOREVER ? "forever" : "classic");
  const [sel, setSel] = useState(TetrisSeed.normalize(seed));
  const [selLevel, setSelLevel] = useState(String(level));

  const forever = tab === "forever";
  const groups = forever ? TetrisScores.byLevel(store) : TetrisScores.bySeed(store);
  const active = groups.filter((g) => g.key === (forever ? selLevel : sel))[0] || groups[0] || null;
  const plays = groups.reduce((n, g) => n + g.plays, 0);

  /* Enter spielt die gewählte Zeile noch einmal — aber nur, wenn dabei keine
     laufende Partie verloren geht; die will man nicht versehentlich wegwerfen. */
  const targetKey = active ? active.key : "";
  useEffect(() => {
    if (!targetKey || running) return;
    function onKey(e) {
      if (e.key !== "Enter" || e.repeat) return;
      if (forever) onPlayLevel(active.level);
      else onPlay(active.seed);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [targetKey, forever, running, onPlay, onPlayLevel]);

  return html`<div class="scores">
    <div class="scores-head">
      <div>
        <h1>Bestenliste</h1>
        <p class="hint tight">
          ${plays} ${plays === 1 ? "Partie" : "Partien"}
          · ${groups.length} ${forever
              ? "Level"
              : (groups.length === 1 ? "Merkwort" : "Merkwörter")}
        </p>
      </div>
      <button class="rb wideb" onClick=${onClose}>Zurück</button>
    </div>

    <div class="scores-tabs">
      <button class=${"rb" + (forever ? "" : " on")}
        onClick=${() => setTab("classic")}>Klassisch · Punkte</button>
      <button class=${"rb" + (forever ? " on" : "")}
        onClick=${() => setTab("forever")}>∞ Endlos · Zeit</button>
    </div>

    ${active ? html`<div class="scores-body">
      <div class="seed-col">
        ${groups.map((g) => html`
          <button key=${g.key} class=${"seed-row-btn" + (g.key === active.key ? " on" : "")}
            onClick=${() => (forever ? setSelLevel(g.key) : setSel(g.key))}>
            <span class="sr-word">${forever ? "Level " + g.level : g.seed}</span>
            <span class="sr-score">
              ${forever ? TetrisScores.formatDuration(g.best.duration) : g.best.score}</span>
            <span class="sr-plays">${g.plays}× gespielt</span>
          </button>`)}
      </div>

      <div class="detail-col">
        <div class="detail-head">
          <div class="dh-word">
            <p class="seed-word">${forever ? "Level " + active.level : active.seed}</p>
            <p class="hint tight">
              ${active.plays} ${active.plays === 1 ? "Partie" : "Partien"}
              · ${forever
                  ? "Bestzeit " + TetrisScores.formatDuration(active.best.duration)
                  : "Bestwert " + active.best.score + " Punkte"}
            </p>
          </div>
          <div class="dh-play">
            ${forever
              ? html`<button class="start small" onClick=${() => onPlayLevel(active.level)}>
                  ▶ Endlos auf Level ${active.level}
                </button>`
              : html`<button class="start small" onClick=${() => onPlay(active.seed)}>
                  ▶ Dieses Wort spielen
                </button>`}
            <p class=${"hint tight" + (running ? " warn" : "")}>
              ${(forever ? "Merkwort " + nextSeed : "Startlevel " + startLevel) +
                (running ? " · verwirft die laufende Partie" : " · Taste Enter")}
            </p>
          </div>
        </div>
        ${active.entries.map((e, i) => html`
          <${PlayCard} key=${e.date + ":" + i} entry=${e} rank=${i + 1}
            metric=${forever ? "time" : "score"} />`)}
      </div>
    </div>` : html`<div class="scores-empty">
      <p class="lead">${forever
        ? "Noch keine Endlospartie gespeichert."
        : "Noch keine klassische Partie gespeichert."}</p>
      <p class="hint">${forever
        ? "Im Endlosspiel bleibt das Level fest — gewertet wird die durchgehaltene Zeit."
        : "Jede beendete Partie kommt von selbst hierher."}</p>
    </div>`}

    ${store.storage === "memory" ? html`<p class="hint warn">
      Kein Datenordner verfügbar — die Liste gilt nur für diese Sitzung.
    </p>` : null}
    <p class="hint tight">Esc schließt die Liste.</p>
  </div>`;
}
</script>
<script>/* Die Aufzeichnung einer Partie und ihr Abspielkopf.
   Aufgezeichnet wird jedes Bild, das sich vom vorherigen unterscheidet — samt
