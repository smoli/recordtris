  return html`<div class=${"play" + (rank === 1 ? " top" : "")}>
    <div class="play-head">
      <span class="rank">${rank}.</span>
      <span class="play-score">${entry.score}</span>
      <span class="play-date">${when || "ohne Zeitpunkt"}</span>
    </div>
    <div class="facts">
      <span><b>${entry.lines}</b> Reihen</span>
      <span>Level <b>${entry.level}</b> · Start ${entry.startLevel}</span>
      <span>Dauer <b>${TetrisScores.formatDuration(entry.duration)}</b></span>
    </div>
    <div class="facts clears">
      ${CLEAR_LABELS.map((label, i) => html`
        <span key=${label}>${label} <b>${entry.clears[i]}</b></span>`)}
    </div>
    <div class="play-pieces">
      ${TetrisPieces.TYPES.map((t) => html`
        <span class="pc" key=${t}><span class=${"chip c-" + t}></span>${entry.pieces[t]}</span>`)}
    </div>
    ${entry.resumed ? html`<p class="resumed">↻ mit Wiedereinstieg gespielt</p>` : null}
  </div>`;
}

function ScoresScreen({ store, seed, startLevel, running, onPlay, onClose }) {
  const { useState, useEffect } = preactHooks;
  const groups = TetrisScores.bySeed(store);
  const [sel, setSel] = useState(TetrisSeed.normalize(seed));
  const active = groups.filter((g) => g.key === sel)[0] || groups[0] || null;
  const word = active ? active.seed : "";

  /* Enter spielt das gewählte Wort noch einmal — aber nur, wenn dabei keine laufende
     Partie verloren geht; die will man nicht versehentlich wegwerfen. */
  useEffect(() => {
    if (!word || running) return;
    function onKey(e) {
      if (e.key === "Enter" && !e.repeat) onPlay(word);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [word, running, onPlay]);

  return html`<div class="scores">
    <div class="scores-head">
      <div>
        <h1>Bestenliste</h1>
        <p class="hint tight">
          ${store.entries.length} ${store.entries.length === 1 ? "Partie" : "Partien"}
          · ${groups.length} ${groups.length === 1 ? "Merkwort" : "Merkwörter"}
        </p>
      </div>
      <button class="rb wideb" onClick=${onClose}>Zurück</button>
    </div>

    ${active ? html`<div class="scores-body">
      <div class="seed-col">
        ${groups.map((g) => html`
          <button key=${g.key} class=${"seed-row-btn" + (g.key === active.key ? " on" : "")}
            onClick=${() => setSel(g.key)}>
            <span class="sr-word">${g.seed}</span>
            <span class="sr-score">${g.best.score}</span>
            <span class="sr-plays">${g.plays}× gespielt</span>
          </button>`)}
      </div>

      <div class="detail-col">
        <div class="detail-head">
          <div class="dh-word">
            <p class="seed-word">${active.seed}</p>
            <p class="hint tight">
              ${active.plays} ${active.plays === 1 ? "Partie" : "Partien"}
              · Bestwert ${active.best.score} Punkte
            </p>
          </div>
          <div class="dh-play">
            <button class="start small" onClick=${() => onPlay(active.seed)}>
              ▶ Dieses Wort spielen
            </button>
            <p class=${"hint tight" + (running ? " warn" : "")}>
              ${running
                ? "Startlevel " + startLevel + " · verwirft die laufende Partie"
                : "Startlevel " + startLevel + " · Taste Enter"}
            </p>
          </div>
        </div>
        ${active.entries.map((e, i) => html`
          <${PlayCard} key=${e.date + ":" + i} entry=${e} rank=${i + 1} />`)}
      </div>
    </div>` : html`<div class="scores-empty">
      <p class="lead">Noch keine Partie gespeichert.</p>
      <p class="hint">Jede beendete Partie kommt von selbst hierher.</p>
    </div>`}

    ${store.storage === "memory" ? html`<p class="hint warn">
      Kein Datenordner verfügbar — die Liste gilt nur für diese Sitzung.
    </p>` : null}
    <p class="hint tight">Esc schließt die Liste.</p>
  </div>`;
}
</script>
<script>/* Die Aufzeichnung einer Partie und ihr Abspielkopf.
   Aufgezeichnet wird jedes Bild, das sich vom vorherigen unterscheidet — samt
   Zustand des Zufalls, damit von jeder Stelle aus weitergespielt werden kann.
   Die Zeitachse ist die gespielte Zeit (state.elapsed), nicht die Zahl der Bilder. */
const TetrisReplay = (function () {
  const SPEEDS = [0.25, 0.5, 1, 2, 4];
  const SPEED_LABELS = ["¼×", "½×", "1×", "2×", "4×"];

  // Zeigt das Bild dasselbe wie das vorherige, muss es nicht aufs Band.
  function sameFrame(a, b) {
    if (a.board !== b.board || a.score !== b.score || a.lines !== b.lines) return false;
    if (a.nextType !== b.nextType || a.over !== b.over) return false;
    if ((a.clearRows === null) !== (b.clearRows === null)) return false;
    if ((a.piece === null) !== (b.piece === null)) return false;
    if (!a.piece) return true;
    return a.piece.type === b.piece.type && a.piece.rot === b.piece.rot &&
           a.piece.x === b.piece.x && a.piece.y === b.piece.y;
  }

  function record(frames, state) {
    const snap = TetrisEngine.snapshot(state);
    const last = frames.length ? frames[frames.length - 1] : null;
    if (last) {
      // Unverändertes Feld: dieselbe Zeichenkette weiterverwenden statt sie zu kopieren.
      if (last.board === snap.board) snap.board = last.board;
      if (sameFrame(last, snap)) return false;
    }
    frames.push(snap);
    return true;
  }

  function cursor(frames, index) {
    const i = Math.max(0, Math.min(frames.length - 1, index));
    return { index: i, playing: false, dir: 1, speed: 1, time: frames[i].t };
  }

  function seek(cur, frames, index) {
    const i = Math.max(0, Math.min(frames.length - 1, index));
    cur.time = frames[i].t;
    if (i === cur.index) return false;
    cur.index = i;
    return true;
  }

  // Ein Bild weiter oder zurück — das hält das Abspielen an.
  function step(cur, frames, delta) {
    cur.playing = false;
    return seek(cur, frames, cur.index + delta) || true;
  }

  /* Abspielen in eine Richtung. Steht der Kopf schon am Ende dieser Richtung,
     beginnt er am anderen Ende von vorn. */
  function play(cur, frames, dir) {
    cur.dir = dir;
    cur.playing = true;
    if (dir > 0 && cur.index >= frames.length - 1) seek(cur, frames, 0);
    else if (dir < 0 && cur.index <= 0) seek(cur, frames, frames.length - 1);
    else cur.time = frames[cur.index].t;
    return true;
  }

  function pause(cur, frames) {
    cur.playing = false;
    cur.time = frames[cur.index].t;
    return true;
  }

  // Ein Bildtakt des Abspielens; liefert, ob sich sichtbar etwas geändert hat.
  function advance(cur, frames, dt) {
    if (!cur.playing) return false;
    const before = cur.index;
    cur.time += dt * cur.speed * cur.dir;
    let i = cur.index;
    if (cur.dir > 0) {
      while (i + 1 < frames.length && frames[i + 1].t <= cur.time) i++;
      if (i >= frames.length - 1) { i = frames.length - 1; cur.playing = false; cur.time = frames[i].t; }
    } else {
      while (i > 0 && frames[i - 1].t >= cur.time) i--;
      if (i <= 0) { i = 0; cur.playing = false; cur.time = frames[0].t; }
    }
    cur.index = i;
    return i !== before || !cur.playing;
  }

  // "1:23,4" — Minuten, Sekunden, Zehntel der gespielten Zeit.
  function formatTime(ms) {
    const tenths = Math.max(0, Math.round(ms / 100));
    const secs = Math.floor(tenths / 10);
    const mm = Math.floor(secs / 60);
    const ss = secs % 60;
    return mm + ":" + (ss < 10 ? "0" + ss : ss) + "," + (tenths % 10);
  }

  return {
    SPEEDS: SPEEDS,
    SPEED_LABELS: SPEED_LABELS,
    record: record,
    cursor: cursor,
    seek: seek,
    step: step,
    play: play,
    pause: pause,
    advance: advance,
    formatTime: formatTime
  };
})();
</script>
<script>/* Die Bedienleiste der Wiedergabe: Schieberegler, Transport, Tempo und der
   Wiedereinstieg. Sie kennt nur den Abspielkopf und meldet Wünsche nach oben. */
function ReplayBar({ frames, cur, canResume, onSeek, onStep, onPlay, onPause, onSpeed, onResume, onClose }) {
  const last = frames.length - 1;
  const frame = frames[cur.index];
  const forward = cur.playing && cur.dir > 0;
  const backward = cur.playing && cur.dir < 0;

  return html`<div class="replay-bar">
    <input class="scrub" type="range" min="0" max=${last} step="1" value=${cur.index}
      onInput=${(e) => onSeek(Number(e.target.value))} />
    <div class="replay-meta">
      <span>${TetrisReplay.formatTime(frame.t)} / ${TetrisReplay.formatTime(frames[last].t)}</span>
      <span>Bild ${cur.index + 1} von ${frames.length}</span>
    </div>

    <div class="replay-row">
      <button class="rb" title="An den Anfang" onClick=${() => onSeek(0)}>⏮</button>
      <button class="rb" title="Ein Bild zurück" onClick=${() => onStep(-1)}>◀|</button>
      <button class=${"rb" + (backward ? " on" : "")} title="Rückwärts abspielen"
        onClick=${() => (backward ? onPause() : onPlay(-1))}>◀◀</button>
      <button class=${"rb" + (forward ? " on" : "")} title="Vorwärts abspielen"
        onClick=${() => (forward ? onPause() : onPlay(1))}>${forward ? "⏸" : "▶"}</button>
      <button class="rb" title="Ein Bild vor" onClick=${() => onStep(1)}>|▶</button>
      <button class="rb" title="Ans Ende" onClick=${() => onSeek(last)}>⏭</button>
    </div>

    <div class="replay-row">
      <span class="replay-label">Tempo</span>
      ${TetrisReplay.SPEEDS.map((s, i) => html`
        <button key=${s} class=${"rb" + (cur.speed === s ? " on" : "")}
          onClick=${() => onSpeed(s)}>${TetrisReplay.SPEED_LABELS[i]}</button>`)}
    </div>

    <div class="replay-row wide">
      <button class="start small" disabled=${!canResume} onClick=${onResume}>Hier weiterspielen</button>
      <button class="rb wideb" onClick=${onClose}>Zurück</button>
    </div>
    ${!canResume && html`<p class="hint tight">Zum Weiterspielen ein Stück zurückspulen.</p>`}
  </div>`;
}

// Die Tastenhilfe der Wiedergabe — sie ersetzt in der Seitenspalte die des Spiels.
function ReplayKeys() {
  return html`<div class="box keys">
    <h2>Wiedergabe</h2>
    <p><kbd>←</kbd><kbd>→</kbd> ein Bild</p>
    <p><kbd>Leer</kbd> abspielen · <kbd>B</kbd> rückwärts</p>
    <p><kbd>1</kbd>…<kbd>5</kbd> Tempo</p>
    <p><kbd>Enter</kbd> hier weiterspielen</p>
    <p><kbd>Esc</kbd> zurück</p>
  </div>`;
}
</script>
<script>/* Zustand und Steuerung. Der Spielzustand liegt in einer Ref und wird vom Bildtakt
   fortgeschrieben; neu gezeichnet wird nur, wenn sich etwas geändert hat. Derselbe
   Takt schreibt jedes veränderte Bild aufs Band — und spielt es auf Wunsch wieder ab. */
const { render } = preact;
const { useState, useRef, useEffect, useCallback } = preactHooks;

const DAS_START = 170; // Wartezeit bis zur Wiederholung beim Halten
const DAS_RATE = 50;   // Abstand der Wiederholungen
const DROP_RATE = 45;  // Wiederholung beim Halten von Pfeil runter

function App() {
  const gameRef = useRef(null);
  const heldRef = useRef({});
  const tapeRef = useRef([]);   // die Aufzeichnung der laufenden Partie
  const replayRef = useRef(null); // der Abspielkopf, solange die Wiedergabe läuft
  const storeRef = useRef(TetrisScores.empty()); // die Bestenliste
  const lastRef = useRef(null);   // der Eintrag der eben beendeten Partie
  const savedRef = useRef(false); // ist die laufende Partie schon eingetragen?
  const [startLevel, setStartLevel] = useState(0);
  const [seedWord, setSeedWord] = useState(() => TetrisSeed.randomWord());
  const [showScores, setShowScores] = useState(false);
  const [, bump] = useState(0);

  // Die Bestenliste kommt aus der Datei — einmal beim Öffnen der App.
  useEffect(() => {
    let alive = true;
    TetrisScores.load().then((s) => {
      if (!alive) return;
      // Wurde beim Lesen schon gespielt, bleiben diese Partien erhalten.
      const pending = storeRef.current.entries;
      if (pending.length) {
        storeRef.current = { version: s.version, entries: s.entries.concat(pending), storage: s.storage };
        TetrisScores.save(storeRef.current).then((saved) => {
          if (!alive) return;
          storeRef.current = saved;
          bump((v) => v + 1);
        });
      } else {
        storeRef.current = s;
      }
      bump((v) => v + 1);
    });
    return () => { alive = false; };
  }, []);

  /* Eine beendete Partie kommt in die Liste: Zeitpunkt, Punkte, Reihen, die
     Reihenschläge und die Steinstatistik — und dann in die Datei. */
  const saveResult = useCallback((g) => {
    const entry = TetrisScores.entryFrom(g);
    lastRef.current = entry;
    storeRef.current = TetrisScores.add(storeRef.current, entry);
    bump((v) => v + 1);
    TetrisScores.save(storeRef.current).then((s) => {
      storeRef.current = s;
      bump((v) => v + 1);
    });
  }, []);

  const startGame = useCallback((lvl, word) => {
    heldRef.current = {};
    tapeRef.current = [];
    replayRef.current = null;
    savedRef.current = false;
    lastRef.current = null;
    gameRef.current = TetrisEngine.create(lvl, word);
    setSeedWord(gameRef.current.seedWord); // ein gewürfeltes Wort bleibt sichtbar
    bump((v) => v + 1);
  }, []);

  const quit = useCallback(() => {
    gameRef.current = null;
    heldRef.current = {};
    tapeRef.current = [];
    replayRef.current = null;
    savedRef.current = false;
    lastRef.current = null;
    bump((v) => v + 1);
  }, []);

  const openScores = useCallback(() => setShowScores(true), []);
  const closeScores = useCallback(() => setShowScores(false), []);

  /* Aus der Bestenliste heraus dieselbe Steinfolge noch einmal: Das Wort wird
     übernommen, die Liste schließt, und ein neues Spiel beginnt damit — eine
     laufende Partie ist danach verworfen. Das Startlevel bleibt das gewählte. */
  const playSeed = useCallback((word) => {
    const clean = TetrisSeed.sanitizeInput(word);
    if (!clean) return;
    setSeedWord(clean);
    setShowScores(false);
    startGame(startLevel, clean);
  }, [startLevel, startGame]);

  // Bildtakt: Schwerkraft, Tastenwiederholung, Aufzeichnung — oder die Wiedergabe.
  useEffect(() => {
    let raf = 0;
    let last = null;
    let seen = -1;
    const step = (t) => {
      const dt = last === null ? 0 : Math.min(t - last, 200);
      last = t;
      const g = gameRef.current;
      const rp = replayRef.current;
      if (rp) {
        if (TetrisReplay.advance(rp, tapeRef.current, dt)) bump((v) => v + 1);
      } else if (g) {
        repeatKeys(g, dt);
        TetrisEngine.update(g, dt);
        if (g.over && !savedRef.current) { savedRef.current = true; saveResult(g); }
        if (g.version !== seen) {
          seen = g.version;
          if (!g.paused) TetrisReplay.record(tapeRef.current, g);
          bump((v) => v + 1);
        }
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [saveResult]);

  function repeatKeys(g, dt) {
    const held = heldRef.current;
    tick(held.left, dt, DAS_START, DAS_RATE, () => TetrisEngine.move(g, -1));
    tick(held.right, dt, DAS_START, DAS_RATE, () => TetrisEngine.move(g, 1));
    tick(held.down, dt, DROP_RATE, DROP_RATE, () => TetrisEngine.softDrop(g));
  }

  function tick(entry, dt, first, rate, action) {
    if (!entry) return;
    entry.timer += dt;
    let guard = 0;
    while (entry.timer >= (entry.fired ? rate : first) && guard++ < 20) {
      entry.timer -= entry.fired ? rate : first;
      entry.fired = true;
      action();
    }
  }

  // --- Wiedergabe ---

  const openReplay = useCallback(() => {
    const frames = tapeRef.current;
    if (!frames.length) return;
    heldRef.current = {};
    replayRef.current = TetrisReplay.cursor(frames, frames.length - 1);
    bump((v) => v + 1);
  }, []);

  const closeReplay = useCallback(() => {
    replayRef.current = null;
    bump((v) => v + 1);
  }, []);

  const seekTo = useCallback((i) => {
    const rp = replayRef.current;
    if (!rp) return;
    rp.playing = false;
    TetrisReplay.seek(rp, tapeRef.current, i);
    bump((v) => v + 1);
  }, []);

  const stepBy = useCallback((d) => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.step(rp, tapeRef.current, d);
    bump((v) => v + 1);
  }, []);

  const playFrom = useCallback((dir) => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.play(rp, tapeRef.current, dir);
    bump((v) => v + 1);
  }, []);

  const pausePlayback = useCallback(() => {
    const rp = replayRef.current;
    if (!rp) return;
    TetrisReplay.pause(rp, tapeRef.current);
    bump((v) => v + 1);
  }, []);

  const setSpeed = useCallback((s) => {
    const rp = replayRef.current;
    if (!rp) return;
    rp.speed = s;
    bump((v) => v + 1);
  }, []);

  /* Wiedereinstieg: Aus dem gezeigten Bild wird wieder ein laufendes Spiel. Das Band
     endet an dieser Stelle und zeichnet von hier an den neuen Verlauf auf. */
  const resumeHere = useCallback(() => {
    const rp = replayRef.current;
    if (!rp) return;
    const frames = tapeRef.current;
    const frame = frames[rp.index];
    if (!frame || frame.over) return;
    tapeRef.current = frames.slice(0, rp.index + 1);
    gameRef.current = TetrisEngine.fromSnapshot(frame);
    // Die Partie ist wieder offen — und trägt fortan den Vermerk des Wiedereinstiegs.
    gameRef.current.resumed = true;
    savedRef.current = false;
    replayRef.current = null;
    heldRef.current = {};
    bump((v) => v + 1);
  }, []);

  useEffect(() => {
    function press(key) { heldRef.current[key] = { timer: 0, fired: false }; }

    function onDown(e) {
      const k = e.key;
      // Im Eingabefeld gehören die Tasten dem Anwender, nicht dem Spiel.
      const inField = e.target && e.target.tagName === "INPUT";
      if (!inField && (k === " " || k.indexOf("Arrow") === 0)) e.preventDefault();

      // Die Bestenliste liegt über allem: sie kennt nur das Schließen.
      if (showScores) {
        if (k === "Escape" || k === "h" || k === "H") closeScores();
        return;
      }

      // In der Wiedergabe gehören die Tasten dem Abspielkopf.
      const rp = replayRef.current;
      if (rp) {
        if (k === "Escape") { closeReplay(); return; }
        if (k === "Enter") { resumeHere(); return; }
        if (inField) return; // der Schieberegler bedient sich sonst selbst
        if (k === "ArrowRight") stepBy(1);
        else if (k === "ArrowLeft") stepBy(-1);
        else if (e.repeat) return;
        else if (k === " ") { if (rp.playing && rp.dir > 0) pausePlayback(); else playFrom(1); }
        else if (k === "b" || k === "B") { if (rp.playing && rp.dir < 0) pausePlayback(); else playFrom(-1); }
        else if (k === "Home") seekTo(0);
        else if (k === "End") seekTo(tapeRef.current.length - 1);
        else if (k.length === 1 && k >= "1" && k <= "5") setSpeed(TetrisReplay.SPEEDS[Number(k) - 1]);
        return;
      }

      if (e.repeat) return;
      const g = gameRef.current;

      if (!g) {
        if (k === "Enter" || (k === " " && !inField)) startGame(startLevel, seedWord);
        else if (!inField && (k === "h" || k === "H")) openScores();
        return;
      }
      if (g.over) {
        if (k === "Enter") startGame(g.startLevel, g.seedWord);
        else if (k === "r" || k === "R") openReplay();
        else if (k === "h" || k === "H") openScores();
        else if (k === "Escape") quit();
        return;
      }
      if (k === "p" || k === "P") { TetrisEngine.togglePause(g); return; }
      if (k === "Escape") { quit(); return; }
      if (g.paused) {
        if (k === "r" || k === "R") openReplay();
        else if (k === "h" || k === "H") openScores();
        return;
      }

      if (k === "ArrowLeft") { TetrisEngine.move(g, -1); press("left"); }
      else if (k === "ArrowRight") { TetrisEngine.move(g, 1); press("right"); }
      else if (k === "ArrowDown") { TetrisEngine.softDrop(g); press("down"); }
      else if (k === "a" || k === "A") TetrisEngine.rotate(g, -1);
      else if (k === "d" || k === "D") TetrisEngine.rotate(g, 1);
      else if (k === " ") TetrisEngine.hardDrop(g);
    }

    function onUp(e) {
      const k = e.key;
      if (k === "ArrowLeft") heldRef.current.left = null;
      else if (k === "ArrowRight") heldRef.current.right = null;
      else if (k === "ArrowDown") heldRef.current.down = null;
    }

    function onBlur() { heldRef.current = {}; }

    window.addEventListener("keydown", onDown);
    window.addEventListener("keyup", onUp);
    window.addEventListener("blur", onBlur);
    return () => {
      window.removeEventListener("keydown", onDown);
      window.removeEventListener("keyup", onUp);
      window.removeEventListener("blur", onBlur);
    };
  }, [startLevel, seedWord, startGame, quit, openReplay, closeReplay,
      seekTo, stepBy, playFrom, pausePlayback, setSpeed, resumeHere,
      showScores, openScores, closeScores]);

  const g = gameRef.current;
  const rp = replayRef.current;
  const store = storeRef.current;

  // Die Bestenliste tritt an die Stelle von allem anderen, solange sie offen ist.
  if (showScores) {
    return html`<div class="app scores-view">
      <${ScoresScreen} store=${store} seed=${g ? g.seedWord : seedWord}
        startLevel=${startLevel} running=${!!(g && !g.over)}
        onPlay=${playSeed} onClose=${closeScores} />
    </div>`;
  }

  // Die Wiedergabe zeigt statt des Spiels das aufgezeichnete Bild — samt Zahlen.
  if (rp && tapeRef.current.length) {
    const frames = tapeRef.current;
    const frame = frames[rp.index];
    const view = TetrisEngine.fromSnapshot(frame);
    return html`<div class="app replaying">
      <aside class="panel left">
        <h2>Statistik</h2>
        <${Stats} stats=${view.stats} />
      </aside>

      <div class="center">
        <div class="stage">
          <${Board} game=${view} />
          <div class=${"replay-tag" + (frame.over ? " end" : "")}>
            ${frame.over ? "Game Over" : "Wiedergabe"}
          </div>
        </div>
        <${ReplayBar} frames=${frames} cur=${rp} canResume=${!frame.over}
          onSeek=${seekTo} onStep=${stepBy} onPlay=${playFrom} onPause=${pausePlayback}
          onSpeed=${setSpeed} onResume=${resumeHere} onClose=${closeReplay} />
      </div>

      <aside class="panel right">
        <div class="box">
          <h2>Punkte</h2><p class="big">${view.score}</p>
        </div>
        <div class="box row">
          <div><h2>Level</h2><p class="big">${view.level}</p></div>
          <div><h2>Reihen</h2><p class="big">${view.lines}</p></div>
        </div>
        <div class="box">
          <h2>Nächster</h2>
          <${Preview} type=${view.nextType} />
        </div>
        <${ReplayKeys} />
      </aside>
    </div>`;
  }

  if (!g) {
    return html`<div class="app">
      <div class="stage intro">
        <${StartScreen} level=${startLevel} onLevel=${setStartLevel}
          seed=${seedWord} onSeed=${setSeedWord}
          summary=${TetrisScores.summaryFor(store, seedWord)}
          onScores=${openScores}
          onStart=${() => startGame(startLevel, seedWord)} />
      </div>
    </div>`;
  }

  /* Nach dem Spielende zeigt die Einblendung, wo diese Partie unter den bisherigen
     mit demselben Merkwort steht. */
  const sum = g.over ? TetrisScores.summaryFor(store, g.seedWord) : null;
  const lastEntry = lastRef.current;
  const isRecord = !!(sum && lastEntry && sum.best === lastEntry);
  const rank = sum && lastEntry ? sum.entries.indexOf(lastEntry) + 1 : 0;

  return html`<div class="app">
    <aside class="panel left">
      <h2>Statistik</h2>
      <${Stats} stats=${g.stats} />
    </aside>

    <div class="stage">
      <${Board} game=${g} />
      ${g.paused && html`<div class="overlay small">
        <h1>Pause</h1>
        <p class="hint">P zum Weiterspielen</p>
        <button class="start small" disabled=${!tapeRef.current.length}
          onClick=${openReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${openScores}>Bestenliste</button>
        <p class="hint">Taste R · Taste H</p></div>`}
      ${g.over && html`<div class="overlay small">
        <h1>Game Over</h1>
        <p class="lead">${g.score} Punkte, ${g.lines} Reihen</p>
        ${isRecord && sum.plays > 1 && html`<p class="record">Neuer Bestwert für dieses Wort!</p>`}
        ${rank > 1 && html`<p class="hint">
          Platz ${rank} von ${sum.plays} · Bestwert ${sum.best.score}</p>`}
        <p class="hint seed-hint">Merkwort <b class="seed-word">${g.seedWord}</b></p>
        <button class="start" onClick=${() => startGame(g.startLevel, g.seedWord)}>Noch einmal</button>
        <button class="start small" disabled=${!tapeRef.current.length}
          onClick=${openReplay}>Aufzeichnung ansehen</button>
        <button class="start small" onClick=${openScores}>Bestenliste</button>
        <p class="hint">Enter dieselbe Folge · R Aufzeichnung · H Bestenliste · Esc zurück</p></div>`}
    </div>

    <aside class="panel right">
      <div class="box">
        <h2>Punkte</h2><p class="big">${g.score}</p>
      </div>
      <div class="box row">
        <div><h2>Level</h2><p class="big">${g.level}</p></div>
        <div><h2>Reihen</h2><p class="big">${g.lines}</p></div>
      </div>
      <div class="box">
        <h2>Nächster</h2>
        <${Preview} type=${g.nextType} />
      </div>
      <div class="box">
        <h2>Merkwort</h2>
        <p class="seed-word">${g.seedWord}</p>
      </div>
      <div class="box keys">
        <h2>Tasten</h2>
        <p><kbd>←</kbd><kbd>→</kbd> verschieben</p>
        <p><kbd>A</kbd><kbd>D</kbd> drehen</p>
        <p><kbd>↓</kbd> ein Feld tiefer</p>
        <p><kbd>Leer</kbd> fallen lassen</p>
        <p><kbd>P</kbd> Pause · <kbd>Esc</kbd> Ende</p>
        <p><kbd>R</kbd> Aufzeichnung (in Pause)</p>
        <p><kbd>H</kbd> Bestenliste (in Pause)</p>
      </div>
    </aside>
  </div>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body>
</html>
